<style>
/* Layout idea: a civil-defence plotting table. Map left, readout right, ranked table below. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d4dbe2;
  --accent:#1d5a86; --accent-ink:#ffffff; --map:#e3e8ed; --map-line:#9aa7b4;
  --gA:#2c8a6a; --gB:#76b25f; --gC:#c2cc57; --gD:#f0c14a; --gE:#ee9a40; --gF:#d85f3b; --gG:#a42c3e;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161c; --surface:#18212a; --ink:#e7ecf1; --muted:#97a4b2; --line:#2b3743;
    --accent:#6fb0dd; --accent-ink:#0c1620; --map:#0f171e; --map-line:#4a5a69; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --ink:#e7ecf1; --muted:#97a4b2; --line:#2b3743;
  --accent:#6fb0dd; --accent-ink:#0c1620; --map:#0f171e; --map-line:#4a5a69; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
a{color:var(--accent)}
.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-size:clamp(30px,5vw,46px);line-height:1}
header p{margin:0;max-width:70ch;color:var(--muted)}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
@media (max-width:860px){.app{grid-template-columns:1fr}.app .stack{display:contents}.app .stack>.card{order:5}.app .stack>#c-search{order:0}.app .mapcol{order:1}.app #result{order:2}}
.chip-read{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:4px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600;white-space:nowrap;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis}
.chip-read .chip{flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input[type=text],input[type=search]{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.result{display:flex;flex-direction:column;gap:12px}
.result .top{display:flex;gap:14px;align-items:center}
.badge{flex:none;width:76px;height:76px;border-radius:6px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:54px;line-height:1;color:#fff}
.badge.dark{color:#18212b}
.result h2{font-size:24px;line-height:1.1}
.result .sub{color:var(--muted);font-size:14px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:14px}
.bar .track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--accent)}
.bar b{font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.facts li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.facts li span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
.sbox{position:relative}
#sugg{position:absolute;left:0;right:0;top:100%;z-index:20;margin:2px 0 0;padding:4px 0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:280px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#sugg[hidden]{display:none}
#sugg li{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;font-size:14px;cursor:pointer}
#sugg li small{color:var(--muted);white-space:nowrap}
#sugg li.on,#sugg li:hover{background:var(--line)}
.layers{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.layers label{display:flex;align-items:center;gap:6px;cursor:pointer}
.sw{display:inline-block;width:10px;height:10px}
.sliders{display:flex;flex-direction:column;gap:8px}
.sl{display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:center;font-size:14px}
.sl .name{grid-column:1/-1}
.sl input{width:100%;accent-color:var(--accent)}
.sl output{font-variant-numeric:tabular-nums;text-align:right}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:6px 10px}
.btn:hover{border-color:var(--accent)}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:8px}
.mapcol{position:relative}
.mapbox{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--map);overflow:hidden;touch-action:none}
svg#map{display:block;width:100%;height:auto;aspect-ratio:197/254;max-height:82vh;cursor:crosshair}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:34px;height:34px;padding:0;font-size:20px;line-height:1}
.legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:4px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.legend .ramp{display:flex}
.legend .ramp span{width:26px;height:18px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px}
.legend .ends{display:flex;justify-content:space-between;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 7px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-130%);display:none}
.tablehead{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin-bottom:10px}
.tablehead h2{font-size:28px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-height:560px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--surface);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
.chip{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:3px;color:#fff;font-weight:700;font-family:var(--font-display);font-size:16px}
.chip.dark{color:#18212b}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.notes p,.notes li{font-size:14px;margin:0 0 8px}
.notes ul{padding-left:18px;margin:0}
.scale{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--ink);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
.scale i{display:block;height:6px;border:2px solid var(--ink);border-top:none}
.north{position:absolute;left:10px;top:10px;width:30px;text-align:center;font-weight:700;font-size:12px;line-height:1;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:4px;padding:4px 0}
.north svg{display:block;margin:0 auto 2px}
#sectbl{min-width:0;font-size:13px}
#sectbl th{position:static;cursor:default;padding:4px 6px}
#sectbl td{padding:5px 6px}
svg text{pointer-events:none;font-family:var(--font-body);paint-order:stroke;stroke:var(--surface);stroke-linejoin:round}
footer{color:var(--muted);font-size:13px;max-width:90ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sitebar{background:#102A5C;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.sitebar>div{max-width:1320px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.sitebar a.home{color:#fff;text-decoration:none;font-family:Georgia,serif;font-weight:700;font-size:19px}
.sitebar a.lib{color:#F2B544;text-decoration:none;font-weight:600;padding:8px 0}
.langbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px}
.langbar .lang{margin-left:auto}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:500 13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.share{--share-accent:var(--accent)}
.eyebrow{font:500 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stamp{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);margin-top:4px}
.story{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.story{grid-template-columns:1fr}}
.story .card{display:flex;flex-direction:column;gap:10px}
.story p{margin:0;max-width:68ch}
.made{font-size:13.5px}
#sugg li.nomatch{cursor:default;color:var(--muted)}
</style>
</head>
<body>
<nav class="sitebar" aria-label="Site"><div>
<a class="home" href="/">Alex Giboi</a>
<a class="lib" href="/library/">← Library</a>
</div></nav>

<div class="wrap">
<div class="langbar">
  <div class="share" data-share></div>
  <div class="lang" role="group" aria-label="Limba / Lingua / Language">
    <button type="button" data-lang="ro" aria-pressed="false">RO</button>
    <button type="button" data-lang="it" aria-pressed="false">IT</button>
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
  </div>
</div>
<header>
  <span class="eyebrow" data-i="eyebrow"></span>
  <h1 data-i="h1"></h1>
  <p data-i="lede"></p>
  <div class="stamp" data-i="stamp"></div>
</header>

<section class="story">
  <div class="card"><span class="eyebrow" data-i="whyEy"></span><h2 data-i="whyH"></h2><div data-i="why" style="display:flex;flex-direction:column;gap:10px"></div></div>
  <div class="card"><span class="eyebrow" data-i="useEy"></span><h2 data-i="useH"></h2><div data-i="use" style="display:flex;flex-direction:column;gap:10px"></div></div>
</section>

<div class="app">
  <aside class="stack">
    <div class="card" id="c-search">
      <label class="lbl" for="q" data-i="find"></label>
      <div class="sbox"><input id="q" type="search" role="combobox" aria-expanded="false" aria-controls="sugg" data-ph="ph" autocomplete="off" spellcheck="false">
      <ul id="sugg" role="listbox" hidden></ul></div>
      <p class="small" style="margin:8px 0 0" data-i="hint"></p>
    </div>

    <div class="card result" id="result" aria-live="polite"></div>

    <div class="card">
      <label class="lbl" data-i="secLbl"></label>
      <table id="sectbl"><thead><tr><th data-i="thNb"></th><th data-i="thAvg"></th><th class="num" data-i="thShel"></th></tr></thead><tbody></tbody></table>
      <p class="small" style="margin:8px 0 0" data-i="secNote"></p>
    </div>

    <div class="card">
      <label class="lbl" data-i="layersLbl"></label>
      <div class="layers" id="layers"></div>
    </div>

    <details class="card">
      <summary data-i="adjust"></summary>
      <div class="sliders" id="sliders"></div>
      <p class="small" style="margin:10px 0 0"><button class="btn" id="reset" type="button" data-i="reset"></button></p>
    </details>
  </aside>

  <section class="mapcol">
    <div class="mapbox" id="mapbox">
      <svg id="map" viewBox="474 686 197 254" role="img" data-al="mapAria"></svg>
      <div class="zoom">
        <button class="btn" id="zin" type="button" data-al="zin">+</button>
        <button class="btn" id="zout" type="button" data-al="zout">−</button>
        <button class="btn" id="zfit" type="button" data-al="zfit" style="font-size:13px">⤢</button>
      </div>
      <div class="chip-read" id="chipread" hidden></div>
      <div class="north" aria-hidden="true"><svg width="14" height="16" viewBox="0 0 14 16"><path d="M7 0L13 15L7 11L1 15z" fill="var(--ink)"/></svg>N</div>
      <div class="legend" id="legend"></div>
      <div class="scale" id="scale"></div>
      <div class="tip" id="tip"></div>
    </div>
  </section>
</div>

<section>
  <div class="tablehead">
    <h2 data-i="rankH"></h2>
    <div style="min-width:240px;flex:0 1 320px"><label class="lbl" for="tq" data-i="filt"></label><input id="tq" type="search" data-ph="filtPh"></div>
  </div>
  <div class="tablewrap">
    <table id="tbl">
      <thead><tr>
        <th data-k="name" data-i="tNb"></th>
        <th data-k="dist" class="num" data-i="sector"></th>
        <th data-k="score" class="num" data-i="tGrade"></th>
        <th data-k="score" class="num" data-i="tScore"></th>
        <th data-k="exp" class="num" data-i="tExp"></th>
        <th data-k="er" class="num" data-i="tEr"></th>
        <th data-k="cov" class="num" data-i="tSh"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<section class="notes">
  <div class="card"><h3 data-i="n1H"></h3><ul data-i="n1"></ul></div>
  <div class="card"><h3 data-i="n2H"></h3><ul data-i="n2"></ul></div>
  <div class="card"><h3 data-i="n3H"></h3><ul data-i="n3"></ul></div>
</section>
<footer><span data-i="disc"></span><br><span class="made" data-i="credit"></span></footer>
<div class="share" data-share="end"></div>
</div>

<script>
const I18N = {
en: {
  title: "Lugano Doomsday Checker — Ion-Alexandru Giboi",
  eyebrow: "Library · Map · Nov 2026",
  h1: "Lugano Doomsday Checker",
  lede: "How exposed is your part of Lugano to a large-scale crisis such as war, a long blackout or a climate catastrophe? Search a postcode, street or place, or click the map, for a grade from A (lowest relative exposure) to G (highest). It ranks the built-up areas of the municipality against each other. It is not a forecast.",
  stamp: "Data: OpenStreetMap, the City of Lugano shelter statistics (June 2022) and swisstopo, pulled 16 Nov 2026",
  whyEy: "Background", whyH: "Why I built this",
  why: "<p>When the UK government launched its “Be Ready” campaign, urging people to stock up on supplies in case of an emergency, Serhii Kashevko, a tech entrepreneur who came to the UK when war broke out in Ukraine, decided the advice needed to depend on where you live. He built a “Doomsday” postcode checker that rates an area from A to G, looking at things such as the distance to likely missile targets, geographical defences, the structure of the building and the nearest A&amp;E. The Times then recreated some of his data points as an interactive map and a searchable table.</p><p>That is where my idea comes from. Preparedness advice works better when it is local. Switzerland has its own rules: federal law requires a protected place for every resident, and the City of Lugano publishes statistics on its shelters, neighbourhood by neighbourhood. So I asked what a similar checker would show for Lugano, using only open data. It is a sibling of my <a href=\"/library/bucharest-doomsday-checker/\">Bucharest Doomsday Checker</a>.</p><p>This is an independent build, not a copy. I have no access to Kashevko’s data or method. Mine uses what is openly available, namely OpenStreetMap, the swisstopo directory of localities and the city’s 2022 shelter statistics, and a simple method you can adjust yourself. It is a way to think about the city, not a prediction.</p>",
  useEy: "In practice", useH: "How it can be used",
  use: "<p><b>As a starting point for a household plan.</b> Type your postcode or street to see your grade, then read the three parts behind it: how far you are from strategic sites, how close the nearest emergency hospital is, and how well your neighbourhood is covered by protected places. The “Supplies and services nearby” list shows the closest pharmacies, supermarkets, fuel stations, and the nearest fire, railway and police stations. That helps with practical questions: where to stock up, where to meet if the household is separated, which way to go first.</p><p><b>To compare places.</b> Check two addresses before renting or buying, or see how the area where a relative lives compares with yours. Teachers, journalists and local planners can use the neighbourhood table and the place ranking, and the sliders under “Adjust the model” show how much the ranking depends on the assumptions.</p><p><b>With care.</b> A grade is relative: it ranks Lugano’s areas against each other and says nothing about how likely any event is. The shelter figure is a neighbourhood average from 2022, so before relying on a shelter, confirm your own place with the municipality. For real guidance, follow the Swiss authorities (Federal Office for Civil Protection, Alertswiss) and the City of Lugano.</p>",
  find: "Find a postcode, street or place in Lugano",
  ph: "e.g. 6900, Via Nassa, Gandria",
  hint: "Each match shows its neighbourhood. House numbers are not searchable yet. Or click anywhere on the map.",
  noMatch: "No match. Try part of the name.", nbSuf: " (neighbourhood)",
  kArea: "Place", kStreet: "Street", kNb: "Neighbourhood", kPlz: "Postcode", sector: "Neighbourhood",
  secLbl: "Neighbourhoods", thNb: "Neighbourhood", thAvg: "Avg grade", thShel: "Shelter",
  secNote: "Average grade over the neighbourhood’s built-up map cells. “Shelter” is the neighbourhood’s protected places per resident, from the city’s 2022 statistics. Loreto has no map area here, see the notes. Tap a row to zoom in.",
  noCells: "no built-up cells",
  layersLbl: "Map layers",
  ly_cells: "Grades", ly_bord: "Lugano border", ly_mun: "Neighbouring municipalities", ly_water: "Rivers and lakes", ly_lab: "Labels", ly_hosp: "Hospitals", ly_site: "Strategic sites", ly_fire: "Fire stations",
  adjust: "Adjust the model", reset: "Reset to defaults",
  sl_M: "Military sites", sl_A: "Airports and airbases", sl_E: "Power plants", sl_G: "Government and courts", sl_T: "Telecom and broadcast", sl_R: "Main rail stations",
  sl_rad: "Site influence radius (km)", sl_wE: "Share: strategic sites (%)", sl_wH: "Share: hospital access (%)", sl_wS: "Share: shelter coverage (%)",
  cat_M: "Military site", cat_A: "Airport or airbase", cat_E: "Power plant", cat_G: "Government or court", cat_T: "Telecom or broadcast", cat_R: "Main rail station",
  emerg: " (emergency)",
  lm0: "Lugano airport", lm1: "Lugano station",
  zin: "Zoom in", zout: "Zoom out", zfit: "Reset view",
  mapAria: "Map of Lugano coloured by relative emergency exposure, grades A to G",
  low: "Lowest exposure", high: "Highest",
  outH: "Outside Lugano", outP: "That spot is outside the municipality of Lugano. Pick a point inside the outline.",
  sel: "Selected point",
  notBuilt: "Not a built-up area on the map, so the grade is for reference only.",
  sub: (nb, sc) => nb + " · Safety score " + sc + " of 100 (higher is safer)",
  bSites: "Distance from strategic sites", bHosp: "Hospital access", bShel: "Shelter coverage",
  fER: "Nearest emergency hospital", none: "none mapped",
  fShel: "Shelter coverage of the neighbourhood", fShelSrc: "City statistics, June 2022", fShelBelow: "(below one place per resident)",
  fSites: r => "Strategic sites within " + r + " km",
  supH: "Supplies and services nearby", fPh: "Pharmacies within 1 km", fSm: "Supermarkets within 1 km", fFu: "Fuel stations within 1.5 km",
  fFire: "Nearest fire station", fRail: "Nearest railway station", fPol: "Nearest police station", stationDef: "Station", policeDef: "Police",
  topH: "Biggest contributors", unnamed: "Unnamed site",
  barNote: "All three bars and the safety score run the same way: 100 is best, 0 is worst. Distance from strategic sites is 100 with no site nearby. Hospital access is 100 next to an emergency hospital and 0 at 15 km or more. Shelter coverage is 100 at one protected place per resident or more. Grades are relative to the other built-up areas of Lugano.",
  rankH: "Place ranking", filt: "Filter", filtPh: "Type a name",
  tNb: "Place", tGrade: "Grade", tScore: "Safety score", tExp: "Site exposure index", tEr: "Nearest ER (km)", tSh: "Shelter coverage",
  n1H: "How the grade is built",
  n1: "<li><b>Exposure to strategic sites.</b> Military sites, airports and airbases, power plants, government and court buildings, communication towers and the four main Ticino rail stations. Sites just outside Lugano count too. Each adds to a cell’s exposure, and the effect fades to zero at the chosen radius.</li><li><b>Distance to an emergency hospital.</b> Further away scores worse, up to 15 km.</li><li><b>Shelter coverage of the neighbourhood.</b> The City of Lugano’s civil protection statistics give protected places per resident for 21 neighbourhoods. At or above 100% (one place per resident) scores best. Below that, the score falls with the shortfall, and a neighbourhood at 0% scores worst.</li><li>The three parts count equally by default, a third each, and you can change that in “Adjust the model”. They are blended, then the built-up cells are split into seven equal-width bands, A to G.</li><li><b>Built-up cells.</b> Grades are shown only for 500 m cells with at least eight mapped buildings inside the municipal boundary. Clicking elsewhere in Lugano still gives a grade, but it is for reference only.</li>",
  n2H: "What it leaves out",
  n2: "<li><b>Scope.</b> The grade is aimed at war-type and system-wide crises. Only war is modelled directly, through strategic sites. For a long blackout, hospital distance is the only part of the grade that applies. Climate catastrophe, ordinary local natural hazards such as floods and landslides, and dam failure are not modelled. No data for them went into this page.</li><li><b>Shelter data is from 2022.</b> The statistics file is dated 1 June 2022, so coverage may have changed. Public shelters hold only about 4.7% of residents. The rest is in private shelters, whose condition and accessibility the statistics do not describe. Coverage is one number per neighbourhood and does not say how far a given home is from a free place.</li><li><b>Neighbourhood boundaries are approximate.</b> OpenStreetMap has no boundaries for Lugano’s neighbourhoods. Each map cell is assigned to the nearest named place, so cells near a border can be assigned to the wrong neighbourhood. Loreto has no marker, so it gets no map area, and its cells go to the neighbouring neighbourhoods. Because Loreto, Centro, Besso, Molino Nuovo and Breganzona are all at 110% or more, the shelter score is the same wherever the line falls among them. Figino is not in the statistics table and is assigned to Barbengo. That is my assumption.</li><li>There is no map of individual shelters. The federal authorities do not publish shelter plans.</li><li>Searching by street name works. Searching by house number does not exist yet.</li><li>Population density and building structure are not included.</li><li>OpenStreetMap is volunteer-built. A missing hospital or site on the map is missing here too.</li><li>A hospital counts as an emergency hospital when OpenStreetMap carries an emergency tag for it. Decommissioned fortresses, bunkers, trenches and shooting ranges are not counted as military sites. Only power plants of 5 MW and above count.</li><li>Rail hubs are a judgement call: Bellinzona, Lugano, Locarno and Chiasso. Government sites are the Palazzo delle Orsoline in Bellinzona, the Federal Criminal Court in Bellinzona and the Palazzo di giustizia in Lugano.</li><li>Grades are relative to the other built-up areas of Lugano. A “G” here says nothing about how Lugano compares with another place.</li>",
  n3H: "Data and credits",
  n3: "<li>Map data © OpenStreetMap contributors (ODbL), pulled via Overpass (overpass.osm.ch) on 16 Nov 2026, including street names, pharmacies, supermarkets, fuel stations, railway stations and police stations.</li><li>Pharmacies, supermarkets and fuel stations within 50 m of each other are counted once. Street search jumps to the middle of the best-mapped stretch of each street in Lugano. A long street runs through several areas, so the pin is a starting point, not the whole street. The supplies and services readout is informational and not part of the grade.</li><li>Shelter coverage: Città di Lugano, Statistica Urbana, “Statistica Protezione Civile: Rifugi e Posti Protetti”, file dated 1 June 2022.</li><li>Postcodes and locality positions: swisstopo, official directory of localities and postcodes (AMTOVZ). Lugano has many postcodes, so a search for 6900 finds the centre and a search for 6978 finds Gandria.</li><li>Idea from the UK “Doomsday” postcode checker by Serhii Kashevko. This is an independent build with its own method and data.</li>",
  disc: "Unofficial tool for general awareness. It does not predict any event and is no substitute for guidance from the authorities (City of Lugano, Sezione del militare e della protezione della popolazione, Federal Office for Civil Protection, Alertswiss).",
  credit: "Researched and built with the help of Claude (Anthropic), using OpenStreetMap and the public sources above. <a href=\"/#contact\">Corrections welcome</a>."
},
it: {
  title: "Lugano Doomsday Checker — Ion-Alexandru Giboi",
  eyebrow: "Library · Mappa · nov 2026",
  h1: "Il Doomsday Checker di Lugano",
  lede: "Quanto è esposta la tua zona di Lugano a una crisi su larga scala, come una guerra, un lungo blackout o una catastrofe climatica? Cerca un CAP, una via o una località, oppure clicca sulla mappa, per ottenere un voto da A (esposizione relativa più bassa) a G (più alta). Confronta tra loro le aree edificate del comune. Non è una previsione.",
  stamp: "Dati: OpenStreetMap, statistica dei rifugi della Città di Lugano (giugno 2022) e swisstopo, scaricati il 16 nov 2026",
  whyEy: "Contesto", whyH: "Perché l’ho fatto",
  why: "<p>Quando il governo britannico ha lanciato la campagna “Be Ready”, che invita a fare scorta di beni essenziali in caso di emergenza, Serhii Kashevko, un imprenditore tecnologico arrivato nel Regno Unito allo scoppio della guerra in Ucraina, ha deciso che il consiglio doveva dipendere da dove si vive. Ha creato un “Doomsday” postcode checker che assegna a una zona un voto da A a G, tenendo conto della distanza da probabili bersagli missilistici, delle difese naturali, della struttura dell’edificio e del pronto soccorso più vicino. Il Times ha poi ricostruito alcuni dei suoi dati in una mappa interattiva e in una tabella ricercabile.</p><p>Da qui nasce la mia idea. I consigli sulla preparazione funzionano meglio se sono locali. La Svizzera ha le sue regole: la legge federale prevede un posto protetto per ogni abitante, e la Città di Lugano pubblica una statistica dei suoi rifugi, quartiere per quartiere. Così mi sono chiesto cosa mostrerebbe uno strumento simile per Lugano, usando solo dati aperti. È il fratello del mio <a href=\"/library/bucharest-doomsday-checker/\">Doomsday Checker di Bucarest</a>.</p><p>È una realizzazione indipendente, non una copia. Non ho accesso ai dati né al metodo di Kashevko. Il mio usa ciò che è disponibile pubblicamente, cioè OpenStreetMap, l’elenco delle località di swisstopo e la statistica dei rifugi della città del 2022, e un metodo semplice che puoi modificare tu stesso. È un modo per ragionare sulla città, non una previsione.</p>",
  useEy: "In pratica", useH: "A cosa può servire",
  use: "<p><b>Come punto di partenza per il piano della famiglia.</b> Scrivi il tuo CAP o la tua via per vedere il voto, poi leggi le tre componenti che lo determinano: quanto sei lontano dai siti strategici, quanto è vicino il pronto soccorso più vicino e quanto è coperto il tuo quartiere dai posti protetti. L’elenco “Approvvigionamenti e servizi vicini” mostra le farmacie, i supermercati e i distributori più vicini, oltre alle stazioni dei vigili del fuoco, ferroviarie e della polizia. Aiuta a rispondere a domande pratiche: dove fare scorta, dove ritrovarsi se la famiglia è separata, da che parte andare per prima cosa.</p><p><b>Per confrontare i luoghi.</b> Controlla due indirizzi prima di affittare o comprare, oppure guarda come si colloca la zona in cui vive un parente rispetto alla tua. Insegnanti, giornalisti e pianificatori locali possono usare la tabella dei quartieri e la classifica dei luoghi, mentre i cursori di “Modifica il modello” mostrano quanto la classifica dipenda dalle ipotesi.</p><p><b>Con prudenza.</b> Il voto è relativo: mette a confronto le zone di Lugano tra loro e non dice nulla sulla probabilità di un evento. Il dato sui rifugi è una media di quartiere del 2022, quindi prima di contare su un rifugio, verifica il tuo caso con il comune. Per le indicazioni vere e proprie, segui le autorità svizzere (Ufficio federale della protezione della popolazione, Alertswiss) e la Città di Lugano.</p>",
  find: "Cerca un CAP, una via o una località a Lugano",
  ph: "es. 6900, Via Nassa, Gandria",
  hint: "Ogni risultato indica il quartiere. I numeri civici non sono ancora ricercabili. Oppure clicca un punto qualsiasi della mappa.",
  noMatch: "Nessun risultato. Prova con una parte del nome.", nbSuf: " (quartiere)",

  secNote: "Voto medio sulle celle edificate del quartiere. “Rifugi” indica i posti protetti per abitante del quartiere, secondo la statistica della città del 2022. Loreto qui non ha un’area sulla mappa, vedi le note. Tocca una riga per ingrandire.",

  bSites: "Distanza dai siti strategici", bHosp: "Accesso agli ospedali", bShel: "Copertura dei rifugi",
  fER: "Pronto soccorso più vicino", none: "nessuno mappato",
  fShel: "Copertura dei rifugi del quartiere", fShelSrc: "Statistica della città, giugno 2022", fShelBelow: "(meno di un posto per abitante)",
  fSites: r => "Siti strategici entro " + r + " km",
  supH: "Approvvigionamenti e servizi vicini", fPh: "Farmacie entro 1 km", fSm: "Supermercati entro 1 km", fFu: "Distributori di carburante entro 1,5 km",
  fFire: "Caserma dei vigili del fuoco più vicina", fRail: "Stazione ferroviaria più vicina", fPol: "Stazione di polizia più vicina", stationDef: "Stazione", policeDef: "Polizia",
  topH: "Contributi maggiori", unnamed: "Sito senza nome",
  barNote: "Le tre barre e il punteggio di sicurezza vanno nello stesso verso: 100 è il massimo, 0 il minimo. La distanza dai siti strategici vale 100 se non ce ne sono vicini. L’accesso agli ospedali vale 100 accanto a un pronto soccorso e 0 a 15 km o più. La copertura dei rifugi vale 100 con almeno un posto protetto per abitante. I voti sono relativi alle altre aree edificate di Lugano.",
  rankH: "Classifica dei luoghi", filt: "Filtra", filtPh: "Scrivi un nome",
  tNb: "Luogo", tGrade: "Voto", tScore: "Punteggio di sicurezza", tExp: "Indice di esposizione ai siti", tEr: "PS più vicino (km)", tSh: "Copertura rifugi",
  n1H: "Come si costruisce il voto",
  n1: "<li><b>Esposizione ai siti strategici.</b> Siti militari, aeroporti e basi aeree, centrali elettriche, edifici del governo e dei tribunali, torri di telecomunicazione e le quattro principali stazioni ferroviarie ticinesi. Contano anche i siti appena fuori Lugano. Ognuno aumenta l’esposizione di una cella, e l’effetto si azzera al raggio scelto.</li><li><b>Distanza dal pronto soccorso.</b> Più è lontano, peggiore è il punteggio, fino a 15 km.</li><li><b>Copertura dei rifugi del quartiere.</b> La statistica della protezione civile della Città di Lugano indica i posti protetti per abitante in 21 quartieri. Da 100% in su (un posto per abitante) il punteggio è il migliore. Al di sotto, il punteggio scende con la carenza, e un quartiere allo 0% ha il punteggio peggiore.</li><li>Le tre componenti pesano in egual misura per impostazione predefinita, un terzo ciascuna, e puoi cambiarlo in “Modifica il modello”. Vengono combinate, poi le celle edificate sono suddivise in sette fasce di uguale ampiezza, da A a G.</li><li><b>Celle edificate.</b> I voti compaiono solo per le celle da 500 m con almeno otto edifici mappati dentro il confine comunale. Cliccando altrove a Lugano si ottiene comunque un voto, ma è solo indicativo.</li>",
  n2H: "Cosa non include",
  n2: "<li><b>Ambito.</b> Il voto riguarda le crisi di tipo bellico e quelle su larga scala. Solo la guerra è modellata direttamente, tramite i siti strategici. Per un lungo blackout vale solo la distanza dall’ospedale. Catastrofe climatica, rischi naturali locali ordinari come alluvioni e frane, e crollo di una diga non sono modellati. Nessun dato su di essi è entrato in questa pagina.</li><li><b>I dati sui rifugi sono del 2022.</b> Il file della statistica è datato 1° giugno 2022, quindi la copertura potrebbe essere cambiata. I rifugi pubblici ospitano solo circa il 4,7% degli abitanti. Il resto è in rifugi privati, di cui la statistica non descrive condizioni e accessibilità. La copertura è un solo numero per quartiere e non dice quanto una singola abitazione sia lontana da un posto libero.</li><li><b>I confini dei quartieri sono approssimativi.</b> OpenStreetMap non ha i confini dei quartieri di Lugano. Ogni cella della mappa è assegnata alla località più vicina, quindi le celle vicino a un confine possono finire nel quartiere sbagliato. Loreto non ha un punto di riferimento, quindi non ha un’area sulla mappa e le sue celle vanno ai quartieri vicini. Poiché Loreto, Centro, Besso, Molino Nuovo e Breganzona sono tutti al 110% o più, il punteggio dei rifugi è lo stesso ovunque cada il confine tra loro. Figino non compare nella tabella della statistica ed è assegnato a Barbengo. È una mia ipotesi.</li><li>Non c’è una mappa dei singoli rifugi. Le autorità federali non pubblicano i piani dei rifugi.</li><li>La ricerca per nome della via funziona. La ricerca per numero civico non esiste ancora.</li><li>Densità di popolazione e struttura degli edifici non sono inclusi.</li><li>OpenStreetMap è costruita da volontari. Un ospedale o un sito che manca sulla mappa manca anche qui.</li><li>Un ospedale conta come ospedale con pronto soccorso quando OpenStreetMap lo indica con un’etichetta di emergenza. Fortezze dismesse, bunker, trincee e poligoni di tiro non sono contati come siti militari. Contano solo le centrali da 5 MW in su.</li><li>I nodi ferroviari sono una scelta discrezionale: Bellinzona, Lugano, Locarno e Chiasso. I siti governativi sono il Palazzo delle Orsoline a Bellinzona, il Tribunale penale federale a Bellinzona e il Palazzo di giustizia a Lugano.</li><li>I voti sono relativi alle altre aree edificate di Lugano. Una “G” qui non dice nulla su come Lugano si confronti con un altro luogo.</li>",
  n3H: "Dati e crediti",
  n3: "<li>Dati della mappa © contributori di OpenStreetMap (ODbL), ottenuti tramite Overpass (overpass.osm.ch) il 16 nov 2026, compresi nomi delle vie, farmacie, supermercati, distributori, stazioni ferroviarie e della polizia.</li><li>Farmacie, supermercati e distributori a meno di 50 m l’uno dall’altro sono contati una sola volta. La ricerca per via porta al centro del tratto meglio mappato di ciascuna via a Lugano. Una via lunga attraversa più zone, quindi il segnaposto è un punto di partenza, non l’intera via. L’elenco di approvvigionamenti e servizi è solo informativo e non entra nel voto.</li><li>Copertura dei rifugi: Città di Lugano, Statistica Urbana, “Statistica Protezione Civile: Rifugi e Posti Protetti”, file datato 1° giugno 2022.</li><li>CAP e posizione delle località: swisstopo, elenco ufficiale delle località e dei CAP (AMTOVZ). Lugano ha molti CAP, quindi cercando 6900 si trova il centro e cercando 6978 si trova Gandria.</li><li>Idea ispirata al “Doomsday” postcode checker britannico di Serhii Kashevko. Questa è una realizzazione indipendente, con metodo e dati propri.</li>",

ro: {
  title: "Lugano Doomsday Checker — Ion-Alexandru Giboi",
  eyebrow: "Library · Hartă · nov. 2026",
  h1: "Doomsday Checker pentru Lugano",
  lede: "Cât de expusă este zona ta din Lugano la o criză de amploare, precum un război, o pană lungă de curent sau o catastrofă climatică? Caută un cod poștal, o stradă sau o localitate, ori dă clic pe hartă, pentru o clasificare de la A (expunere relativă cea mai mică) la G (cea mai mare). Compară între ele zonele construite ale comunei. Aceasta nu este o prognoză.",
  stamp: "Date: OpenStreetMap, statistica adăposturilor orașului Lugano (iunie 2022) și swisstopo, preluate la 16 nov. 2026",
  whyEy: "Context", whyH: "De ce am făcut asta",
  why: "<p>Când guvernul britanic a lansat campania „Be Ready”, prin care îndeamnă oamenii să facă provizii pentru situații de urgență, Serhii Kashevko, un antreprenor din tehnologie ajuns în Regatul Unit odată cu izbucnirea războiului din Ucraina, a hotărât că sfatul trebuie adaptat la locul în care locuiești. A creat un verificator „Doomsday” după codul poștal, care evaluează o zonă de la A la G, luând în calcul lucruri precum distanța până la posibile ținte ale rachetelor, apărarea geografică, structura clădirii și cea mai apropiată unitate de urgență. Ziarul The Times a refăcut apoi o parte din datele lui sub forma unei hărți interactive și a unui tabel în care se poate căuta.</p><p>De aici vine ideea mea. Sfaturile de pregătire funcționează mai bine când sunt locale. Elveția are propriile reguli: legea federală cere un loc protejat pentru fiecare locuitor, iar orașul Lugano publică statistici despre adăposturile sale, cartier cu cartier. Așa că m-am întrebat ce ar arăta un instrument similar pentru Lugano, folosind doar date deschise. Este înrudit cu <a href=\"/library/bucharest-doomsday-checker/\">Doomsday Checker pentru București</a>.</p><p>Este o realizare independentă, nu o copie. Nu am acces la datele sau la metoda lui Kashevko. A mea folosește ce este disponibil public, adică OpenStreetMap, lista localităților de la swisstopo și statistica adăposturilor orașului din 2022, și o metodă simplă pe care o poți ajusta singur. Este un mod de a gândi despre oraș, nu o prognoză.</p>",
  useEy: "În practică", useH: "La ce poate folosi",
  use: "<p><b>Ca punct de pornire pentru planul familiei.</b> Scrie codul poștal sau strada ta ca să vezi clasificarea, apoi citește cele trei componente din spatele ei: cât de departe ești de obiectivele strategice, cât de aproape este cel mai apropiat spital cu urgențe și cât de bine este acoperit cartierul tău cu locuri protejate. Lista „Aprovizionare și servicii în apropiere” arată cele mai apropiate farmacii, supermarketuri și benzinării, plus cele mai apropiate stații de pompieri, gări și secții de poliție. Te ajută la întrebări practice: unde faci provizii, unde vă întâlniți dacă familia este separată, încotro mergi mai întâi.</p><p><b>Pentru a compara locuri.</b> Verifică două adrese înainte de a închiria sau a cumpăra, sau vezi cum se compară zona în care locuiește o rudă cu a ta. Profesorii, jurnaliștii și planificatorii locali pot folosi tabelul cartierelor și clasamentul locurilor, iar cursoarele din „Ajustează modelul” arată cât depinde clasamentul de ipoteze.</p><p><b>Cu grijă.</b> Clasificarea este relativă: ierarhizează zonele din Lugano între ele și nu spune nimic despre cât de probabil este un eveniment. Cifra privind adăposturile este o medie pe cartier din 2022, așa că înainte să te bazezi pe un adăpost, verifică situația ta cu primăria. Pentru indicații reale, urmează autoritățile elvețiene (Oficiul Federal pentru Protecția Populației, Alertswiss) și orașul Lugano.</p>",

  sub: (nb, sc) => nb + " · Scor de siguranță " + sc + " din 100 (mai mare înseamnă mai sigur)",
  bSites: "Distanța față de obiectivele strategice", bHosp: "Acces la spital", bShel: "Acoperirea cu adăposturi",
  fER: "Cel mai apropiat spital cu urgențe", none: "niciunul pe hartă",
  fShel: "Acoperirea cu adăposturi a cartierului", fShelSrc: "Statistica orașului, iunie 2022", fShelBelow: "(sub un loc pe locuitor)",
  fSites: r => "Obiective strategice pe o rază de " + r + " km",
  supH: "Aprovizionare și servicii în apropiere", fPh: "Farmacii pe o rază de 1 km", fSm: "Supermarketuri pe o rază de 1 km", fFu: "Benzinării pe o rază de 1,5 km",
  fFire: "Cea mai apropiată stație de pompieri", fRail: "Cea mai apropiată gară", fPol: "Cea mai apropiată secție de poliție", stationDef: "Gară", policeDef: "Poliție",
  topH: "Cei mai mari contribuitori", unnamed: "Obiectiv fără nume",
  barNote: "Cele trei bare și scorul de siguranță merg în același sens: 100 este cel mai bine, 0 cel mai rău. Distanța față de obiectivele strategice este 100 când nu există niciunul în apropiere. Accesul la spital este 100 lângă un spital cu urgențe și 0 la 15 km sau mai mult. Acoperirea cu adăposturi este 100 la cel puțin un loc protejat pe locuitor. Clasificarea este relativă la celelalte zone construite din Lugano.",
  rankH: "Clasamentul locurilor", filt: "Filtrează", filtPh: "Scrie un nume",
  tNb: "Loc", tGrade: "Clasă", tScore: "Scor de siguranță", tExp: "Indice de expunere la obiective", tEr: "UPU cel mai apropiat (km)", tSh: "Acoperire adăposturi",
  n1H: "Cum se construiește clasificarea",
  n1: "<li><b>Expunerea la obiective strategice.</b> Unități militare, aeroporturi și baze aeriene, centrale electrice, clădiri guvernamentale și instanțe, turnuri de telecomunicații și cele patru gări principale din Ticino. Contează și obiectivele aflate chiar în afara orașului Lugano. Fiecare crește expunerea unei celule, iar efectul scade la zero la raza aleasă.</li><li><b>Distanța până la un spital cu urgențe.</b> Cu cât e mai departe, cu atât scorul e mai slab, până la 15 km.</li><li><b>Acoperirea cu adăposturi a cartierului.</b> Statistica de protecție civilă a orașului Lugano indică locurile protejate pe locuitor pentru 21 de cartiere. La 100% sau peste (un loc pe locuitor) scorul este cel mai bun. Sub această valoare, scorul scade odată cu deficitul, iar un cartier la 0% are cel mai slab scor.</li><li>Cele trei componente contează la fel în mod implicit, câte o treime, și poți schimba asta în „Ajustează modelul”. Ele se combină, apoi celulele construite sunt împărțite în șapte intervale egale, de la A la G.</li><li><b>Celule construite.</b> Clasificarea apare doar pentru celulele de 500 m cu cel puțin opt clădiri cartografiate în interiorul limitei comunei. Un clic în altă parte din Lugano dă tot o clasificare, dar are doar rol orientativ.</li>",
  n2H: "Ce nu include",
  n2: "<li><b>Domeniu.</b> Clasificarea vizează crizele de tip război și cele de amploare. Doar războiul este modelat direct, prin obiectivele strategice. Pentru o pană lungă de curent contează doar distanța până la spital. Catastrofa climatică, pericolele naturale locale obișnuite, precum inundațiile și alunecările de teren, și ruperea unui baraj nu sunt modelate. Nicio dată despre ele nu a intrat în această pagină.</li><li><b>Datele despre adăposturi sunt din 2022.</b> Fișierul statisticii este datat 1 iunie 2022, deci acoperirea s-ar putea să fi schimbat. Adăposturile publice cuprind doar circa 4,7% dintre locuitori. Restul sunt adăposturi private, a căror stare și accesibilitate nu sunt descrise în statistică. Acoperirea este o singură cifră pe cartier și nu spune cât de departe este o anumită locuință de un loc liber.</li><li><b>Limitele cartierelor sunt aproximative.</b> OpenStreetMap nu are limitele cartierelor din Lugano. Fiecare celulă a hărții este atribuită celei mai apropiate localități denumite, deci celulele de lângă o limită pot ajunge în cartierul greșit. Loreto nu are un punct de reper, așa că nu are zonă pe hartă, iar celulele lui merg la cartierele vecine. Cum Loreto, Centro, Besso, Molino Nuovo și Breganzona sunt toate la 110% sau peste, scorul adăposturilor este același oriunde ar trece linia dintre ele. Figino nu apare în tabelul statisticii și este atribuit cartierului Barbengo. Aceasta este ipoteza mea.</li><li>Nu există o hartă a adăposturilor individuale. Autoritățile federale nu publică planurile adăposturilor.</li><li>Căutarea după numele străzii funcționează. Căutarea după numărul de casă nu există încă.</li><li>Densitatea populației și structura clădirilor nu sunt incluse.</li><li>OpenStreetMap este construită de voluntari. Un spital sau un obiectiv care lipsește de pe hartă lipsește și aici.</li><li>Un spital este considerat spital cu urgențe când OpenStreetMap îl marchează cu o etichetă de urgență. Fortificațiile dezafectate, buncărele, șanțurile și poligoanele de tir nu sunt numărate ca obiective militare. Contează doar centralele de 5 MW sau mai mari.</li><li>Nodurile feroviare sunt o alegere de judecată: Bellinzona, Lugano, Locarno și Chiasso. Obiectivele guvernamentale sunt Palazzo delle Orsoline din Bellinzona, Tribunalul Penal Federal din Bellinzona și Palazzo di giustizia din Lugano.</li><li>Clasificarea este relativă la celelalte zone construite din Lugano. Un „G” aici nu spune nimic despre cum se compară Lugano cu alt loc.</li>",
  n3H: "Date și credite",
  n3: "<li>Date hartă © contribuitorii OpenStreetMap (ODbL), obținute prin Overpass (overpass.osm.ch) la 16 nov. 2026, inclusiv numele străzilor, farmacii, supermarketuri, benzinării, gări și secții de poliție.</li><li>Farmaciile, supermarketurile și benzinăriile aflate la mai puțin de 50 m una de alta sunt numărate o singură dată. Căutarea după stradă duce în mijlocul porțiunii celei mai bine cartografiate din fiecare stradă din Lugano. O stradă lungă traversează mai multe zone, deci marcajul este un punct de pornire, nu întreaga stradă. Lista de aprovizionare și servicii are doar rol informativ și nu intră în clasificare.</li><li>Acoperirea cu adăposturi: Città di Lugano, Statistica Urbana, „Statistica Protezione Civile: Rifugi e Posti Protetti”, fișier datat 1 iunie 2022.</li><li>Codurile poștale și poziția localităților: swisstopo, registrul oficial al localităților și codurilor poștale (AMTOVZ). Lugano are multe coduri poștale, așa că o căutare după 6900 găsește centrul, iar una după 6978 găsește Gandria.</li><li>Idee preluată de la verificatorul britanic „Doomsday” după codul poștal al lui Serhii Kashevko. Aceasta este o realizare independentă, cu metodă și date proprii.</li>",
  disc: "Instrument neoficial, pentru informare generală. Nu prezice niciun eveniment și nu înlocuiește indicațiile autorităților (orașul Lugano, Sezione del militare e della protezione della popolazione, Oficiul Federal pentru Protecția Populației, Alertswiss).",
  credit: "Cercetat și realizat cu ajutorul lui Claude (Anthropic), folosind OpenStreetMap și sursele publice de mai sus. <a href=\"/#contact\">Corecturile sunt binevenite</a>."
}

const setVB = () => { svg.setAttribute("viewBox", VB.map(v => v.toFixed(1)).join(" ")); drawLabels(); scaleMarks(); };
function zoom(f, cx, cy) {
  const w = Math.max(40, Math.min(FULL[2], VB[2] * f)), h = w * FULL[3] / FULL[2];
  cx = cx ?? VB[0] + VB[2] / 2; cy = cy ?? VB[1] + VB[3] / 2;
  VB = [Math.max(FULL[0], Math.min(FULL[0] + FULL[2] - w, cx - (cx - VB[0]) * w / VB[2])), Math.max(FULL[1], Math.min(FULL[1] + FULL[3] - h, cy - (cy - VB[1]) * h / VB[3])), w, h];
  setVB();
}
function focusOn(la, lo, ww) { const w = ww || 90, h = w * FULL[3] / FULL[2]; VB = [Math.max(FULL[0], Math.min(FULL[0] + FULL[2] - w, px(lo) - w / 2)), Math.max(FULL[1], Math.min(FULL[1] + FULL[3] - h, py(la) - h / 2)), w, h]; setVB(); }
const ppu = () => { const m = svg.getScreenCTM(); return m ? m.a : svg.getBoundingClientRect().width / VB[2]; }; // screen px per map unit (accounts for letterboxing)
const evPt = e => { const m = svg.getScreenCTM(); if (!m) return [VB[0], VB[1]]; const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse()); return [p.x, p.y]; };
document.getElementById("zin").onclick = () => zoom(.6);
document.getElementById("zout").onclick = () => zoom(1 / .6);
window.addEventListener("resize", drawLabels);
document.getElementById("zfit").onclick = () => { VB = FULL.slice(); setVB(); };
svg.addEventListener("wheel", e => { e.preventDefault(); const [x, y] = evPt(e); zoom(e.deltaY < 0 ? .8 : 1.25, x, y); }, { passive: false });
let drag = null;
svg.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, vb: VB.slice(), moved: false }; svg.setPointerCapture(e.pointerId); });
svg.addEventListener("pointermove", e => {
  const tip = document.getElementById("tip");
  const t = e.target.closest("[data-h],[data-s]");
  if (t && !drag) { const r = document.getElementById("mapbox").getBoundingClientRect(); tip.textContent = t.dataset.h !== undefined ? HOSP[+t.dataset.h].n + (HOSP[+t.dataset.h].er ? T("emerg") : "") : T("cat_" + SITES[+t.dataset.s].c) + (SITES[+t.dataset.s].n ? ": " + SITES[+t.dataset.s].n : ""); tip.style.left = (e.clientX - r.left) + "px"; tip.style.top = (e.clientY - r.top) + "px"; tip.style.display = "block"; } else tip.style.display = "none";
  if (!drag) return;
  const k = 1 / ppu(), dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  if (drag.moved) { VB = [Math.max(FULL[0], Math.min(FULL[0] + FULL[2] - VB[2], drag.vb[0] - dx * k)), Math.max(FULL[1], Math.min(FULL[1] + FULL[3] - VB[3], drag.vb[1] - dy * k)), VB[2], VB[3]]; setVB(); }
});
svg.addEventListener("pointerup", e => {
  if (drag && !drag.moved) { const [x, y] = evPt(e); showPin(toLat(y), toLon(x)); }
  drag = null;
});

/* ---------- controls ---------- */
const lay = document.getElementById("layers");
Object.entries(LAYERS).forEach(([k, [name, g, on]]) => {
  g.style.display = on ? "" : "none";
  const l = document.createElement("label"); l.innerHTML = `<input type="checkbox" id="ly-${k}" ${on ? "checked" : ""}> <span data-i="${name}"></span>`;
  l.querySelector("input").onchange = e => g.style.display = e.target.checked ? "" : "none";
  lay.appendChild(l);
});
const SL = [["M", "sl_M", 0, 5, 1], ["A", "sl_A", 0, 5, 1], ["E", "sl_E", 0, 5, 1], ["G", "sl_G", 0, 5, 1], ["T", "sl_T", 0, 5, 1], ["R", "sl_R", 0, 5, 1],
  ["rad", "sl_rad", 2, 10, 1], ["wE", "sl_wE", 0, 100, 5], ["wH", "sl_wH", 0, 100, 5], ["wS", "sl_wS", 0, 100, 5]];
const slWrap = document.getElementById("sliders");
SL.forEach(([k, name, mn, mx, st]) => {
  const d = document.createElement("div"); d.className = "sl";
  d.innerHTML = `<label class="name" for="s-${k}" data-i="${name}"></label><input id="s-${k}" type="range" min="${mn}" max="${mx}" step="${st}" value="${P[k]}"><output id="o-${k}">${P[k]}</output>`;
  d.querySelector("input").addEventListener("input", e => { P[k] = +e.target.value; document.getElementById("o-" + k).textContent = P[k]; clearTimeout(window.__t); window.__t = setTimeout(recalc, 60); });
  slWrap.appendChild(d);
});
document.getElementById("reset").onclick = () => { P = { ...DEFAULTS }; SL.forEach(([k]) => { document.getElementById("s-" + k).value = P[k]; document.getElementById("o-" + k).textContent = P[k]; }); recalc(); };

const leg = document.getElementById("legend");
leg.innerHTML = `<div class="ramp">${GR.map(g => `<span class="${dark(g)}" style="background:var(--g${g});${dark(g) ? "color:#18212b" : ""}">${g}</span>`).join("")}</div><div class="ends"><span data-i="low"></span><span data-i="high"></span></div>`;

/* ---------- language ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = T("title");
  document.querySelectorAll("[data-i]").forEach(e => { const v = T(e.dataset.i); if (typeof v === "string") e.innerHTML = v; });
  document.querySelectorAll("[data-ph]").forEach(e => e.placeholder = T(e.dataset.ph));
  document.querySelectorAll("[data-al]").forEach(e => e.setAttribute("aria-label", T(e.dataset.al)));
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));
  sg.hidden = true;
}
function relang() { applyLang(); renderSectors(); renderTable(); drawLabels(); if (pin) showPin(pin.la, pin.lo, pin.label); }
document.querySelectorAll(".lang button").forEach(btn => btn.addEventListener("click", () => {
  lang = btn.dataset.lang;
  try { localStorage.setItem("bdc-lang", lang); } catch (e) {}
  try { history.replaceState(null, "", "#" + lang); } catch (e) {}
  relang();
}));

applyLang();
drawStatic();
recalc();
setVB();
const start = SUBS.find(s => s.name === "Lugano") || SUBS[0];
showPin(start.la, start.lo, start.name);
</script>
