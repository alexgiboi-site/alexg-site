<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Bucharest Doomsday Checker — Ion-Alexandru Giboi</title>

<meta property="og:title" content="Bucharest Doomsday Checker">
<meta property="og:description" content="How exposed is your part of Bucharest in a national emergency? A relative grade from A to G for any street, built from open data. In English, Italian and Romanian.">

<meta property="og:site_name" content="Ion-Alexandru Giboi">
<meta property="og:image" content="https://alexgiboi.com/library/bucharest-doomsday-checker/share-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Bucharest Doomsday Checker, a map of relative emergency exposure on alexgiboi.com">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/share.css">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout idea: a civil-defence plotting table. Map left, readout right, ranked table below. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d4dbe2;
  --accent:#1d5a86; --accent-ink:#ffffff; --map:#e3e8ed; --map-line:#9aa7b4;
  --gA:#2c8a6a; --gB:#76b25f; --gC:#c2cc57; --gD:#f0c14a; --gE:#ee9a40; --gF:#d85f3b; --gG:#a42c3e;
  --font-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161c; --surface:#18212a; --ink:#e7ecf1; --muted:#97a4b2; --line:#2b3743;
    --accent:#6fb0dd; --accent-ink:#0c1620; --map:#0f171e; --map-line:#4a5a69; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --ink:#e7ecf1; --muted:#97a4b2; --line:#2b3743;
  --accent:#6fb0dd; --accent-ink:#0c1620; --map:#0f171e; --map-line:#4a5a69; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
a{color:var(--accent)}
.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-size:clamp(30px,5vw,46px);line-height:1}
header p{margin:0;max-width:70ch;color:var(--muted)}
.app{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
@media (max-width:860px){.app{grid-template-columns:1fr}.app .stack{display:contents}.app .stack>.card{order:5}.app .stack>#c-search{order:0}.app .mapcol{order:1}.app #result{order:2}}
.chip-read{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--line);border-radius:4px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600;white-space:nowrap;max-width:calc(100% - 140px);overflow:hidden;text-overflow:ellipsis}
.chip-read .chip{flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:14px}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input[type=text],input[type=search]{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.result{display:flex;flex-direction:column;gap:12px}
.result .top{display:flex;gap:14px;align-items:center}
.badge{flex:none;width:76px;height:76px;border-radius:6px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:54px;line-height:1;color:#fff}
.badge.dark{color:#18212b}
.result h2{font-size:24px;line-height:1.1}
.result .sub{color:var(--muted);font-size:14px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:14px}
.bar .track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;background:var(--accent)}
.bar b{font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.facts li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:6px}
.facts li span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--muted)}
.sbox{position:relative}
#sugg{position:absolute;left:0;right:0;top:100%;z-index:20;margin:2px 0 0;padding:4px 0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:280px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#sugg[hidden]{display:none}
#sugg li{display:flex;justify-content:space-between;gap:10px;padding:7px 12px;font-size:14px;cursor:pointer}
#sugg li small{color:var(--muted);white-space:nowrap}
#sugg li.on,#sugg li:hover{background:var(--line)}
.layers{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.layers label{display:flex;align-items:center;gap:6px;cursor:pointer}
.sw{display:inline-block;width:10px;height:10px}
.sliders{display:flex;flex-direction:column;gap:8px}
.sl{display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:center;font-size:14px}
.sl .name{grid-column:1/-1}
.sl input{width:100%;accent-color:var(--accent)}
.sl output{font-variant-numeric:tabular-nums;text-align:right}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:6px 10px}
.btn:hover{border-color:var(--accent)}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:8px}
.mapcol{position:relative}
.mapbox{position:relative;border:1px solid var(--line);border-radius:6px;background:var(--map);overflow:hidden;touch-action:none}
svg#map{display:block;width:100%;height:auto;aspect-ratio:953/1106;max-height:82vh;cursor:crosshair}
.zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom .btn{width:34px;height:34px;padding:0;font-size:20px;line-height:1}
.legend{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:4px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.legend .ramp{display:flex}
.legend .ramp span{width:26px;height:18px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:12px}
.legend .ends{display:flex;justify-content:space-between;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:3px 7px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-130%);display:none}
.tablehead{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin-bottom:10px}
.tablehead h2{font-size:28px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-height:560px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--surface);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
.chip{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:3px;color:#fff;font-weight:700;font-family:var(--font-display);font-size:16px}
.chip.dark{color:#18212b}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.notes p,.notes li{font-size:14px;margin:0 0 8px}
.notes ul{padding-left:18px;margin:0}
.scale{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--ink);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
.scale i{display:block;height:6px;border:2px solid var(--ink);border-top:none}
.north{position:absolute;left:10px;top:10px;width:30px;text-align:center;font-weight:700;font-size:12px;line-height:1;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:4px;padding:4px 0}
.north svg{display:block;margin:0 auto 2px}
#sectbl{min-width:0;font-size:13px}
#sectbl th{position:static;cursor:default;padding:4px 6px}
#sectbl td{padding:5px 6px}
svg text{pointer-events:none;font-family:var(--font-body);paint-order:stroke;stroke:var(--surface);stroke-linejoin:round}
footer{color:var(--muted);font-size:13px;max-width:90ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sitebar{background:#102A5C;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)))}
.sitebar>div{max-width:1320px;margin:0 auto;padding:14px 16px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between}
.sitebar a.home{color:#fff;text-decoration:none;font-family:Georgia,serif;font-weight:700;font-size:19px}
.sitebar a.lib{color:#F2B544;text-decoration:none;font-weight:600;padding:8px 0}
.langbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px}
.langbar .lang{margin-left:auto}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:500 13px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.share{--share-accent:var(--accent)}
.eyebrow{font:500 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stamp{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);margin-top:4px}
.story{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.story{grid-template-columns:1fr}}
.story .card{display:flex;flex-direction:column;gap:10px}
.story p{margin:0;max-width:68ch}
.made{font-size:13.5px}
#sugg li.nomatch{cursor:default;color:var(--muted)}
.mk>*{transform-box:fill-box;transform-origin:center;transform:scale(var(--ms,1))}
</style>
</head>
<body>
<nav class="sitebar" aria-label="Site"><div>
<a class="home" href="/">Alex Giboi</a>
<a class="lib" href="/library/">← Library</a>
</div></nav>

<div class="wrap">
<div class="langbar">
  <div class="share" data-share></div>
  <div class="lang" role="group" aria-label="Limba / Lingua / Language">
    <button type="button" data-lang="ro" aria-pressed="false">RO</button>
    <button type="button" data-lang="it" aria-pressed="false">IT</button>
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
  </div>
</div>
<header>
  <span class="eyebrow" data-i="eyebrow"></span>
  <h1 data-i="h1"></h1>
  <p data-i="lede"></p>
  <div class="stamp" data-i="stamp"></div>
</header>

<section class="story">
  <div class="card"><span class="eyebrow" data-i="whyEy"></span><h2 data-i="whyH"></h2><div data-i="why" style="display:flex;flex-direction:column;gap:10px"></div></div>
  <div class="card"><span class="eyebrow" data-i="useEy"></span><h2 data-i="useH"></h2><div data-i="use" style="display:flex;flex-direction:column;gap:10px"></div></div>
</section>

<div class="app">
  <aside class="stack">
    <div class="card" id="c-search">
      <label class="lbl" for="q" data-i="find"></label>
      <div class="sbox"><input id="q" type="search" role="combobox" aria-expanded="false" aria-controls="sugg" data-ph="ph" autocomplete="off" spellcheck="false">
      <ul id="sugg" role="listbox" hidden></ul></div>
      <p class="small" style="margin:8px 0 0" data-i="hint"></p>
    </div>

    <div class="card result" id="result" aria-live="polite"></div>

    <div class="card">
      <label class="lbl" data-i="secLbl"></label>
      <table id="sectbl"><thead><tr><th data-i="thSector"></th><th data-i="thAvg"></th><th class="num" data-i="thShel"></th><th class="num" data-i="thER"></th></tr></thead><tbody></tbody></table>
      <p class="small" style="margin:8px 0 0" data-i="secNote"></p>
    </div>

    <div class="card">
      <label class="lbl" data-i="layersLbl"></label>
      <div class="layers" id="layers"></div>
    </div>

    <details class="card">
      <summary data-i="adjust"></summary>
      <div class="sliders" id="sliders"></div>
      <p class="small" style="margin:10px 0 0"><button class="btn" id="reset" type="button" data-i="reset"></button></p>
    </details>
  </aside>

  <section class="mapcol">
    <div class="mapbox" id="mapbox">
      <svg id="map" viewBox="0 0 953 1106" role="img" data-al="mapAria"></svg>
      <div class="zoom">
        <button class="btn" id="zin" type="button" data-al="zin">+</button>
        <button class="btn" id="zout" type="button" data-al="zout">−</button>
        <button class="btn" id="zfit" type="button" data-al="zfit" style="font-size:13px">⤢</button>
      </div>
      <div class="chip-read" id="chipread" hidden></div>
      <div class="north" aria-hidden="true"><svg width="14" height="16" viewBox="0 0 14 16"><path d="M7 0L13 15L7 11L1 15z" fill="var(--ink)"/></svg>N</div>
      <div class="legend" id="legend"></div>
      <div class="scale" id="scale"></div>
      <div class="tip" id="tip"></div>
    </div>
  </section>
</div>

<section>
  <div class="tablehead">
    <h2 data-i="rankH"></h2>
    <div style="min-width:240px;flex:0 1 320px"><label class="lbl" for="tq" data-i="filt"></label><input id="tq" type="search" data-ph="filtPh"></div>
  </div>
  <div class="tablewrap">
    <table id="tbl">
      <thead><tr>
        <th data-k="name" data-i="tNb"></th>
        <th data-k="sec" class="num" data-i="sector"></th>
        <th data-k="score" class="num" data-i="tGrade"></th>
        <th data-k="score" class="num" data-i="tScore"></th>
        <th data-k="exp" class="num" data-i="tExp"></th>
        <th data-k="er" class="num" data-i="tEr"></th>
        <th data-k="sh" class="num" data-i="tSh"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<section class="notes">
  <div class="card"><h3 data-i="n1H"></h3><ul data-i="n1"></ul></div>
  <div class="card"><h3 data-i="n2H"></h3><ul data-i="n2"></ul></div>
  <div class="card"><h3 data-i="n3H"></h3><ul data-i="n3"></ul></div>
</section>
<footer><span data-i="disc"></span><br><span class="made" data-i="credit"></span></footer>
<div class="share" data-share="end"></div>
</div>

<script>
const I18N = {
en: {
  title: "Bucharest Doomsday Checker — Ion-Alexandru Giboi",
  eyebrow: "Library · Map · Nov 2026",
  h1: "Bucharest Doomsday Checker",
  lede: "How exposed is your part of Bucharest if a national emergency hits? Search a street or neighbourhood, or click the map, for a grade from A (lowest relative exposure) to G (highest). It ranks areas against each other inside Bucharest. It is not a forecast.",
  stamp: "Data: OpenStreetMap and the IGSU shelter list, pulled 16 Nov 2026",
  whyEy: "Background", whyH: "Why I built this",
  why: "<p>When the UK government launched its “Be Ready” campaign, urging people to stock up on supplies in case of an emergency, Serhii Kashevko, a tech entrepreneur who came to the UK when war broke out in Ukraine, decided the advice needed to depend on where you live. He built a “Doomsday” postcode checker that rates an area from A to G, looking at things such as the distance to likely missile targets, geographical defences, the structure of the building and the nearest A&amp;E. The Times then recreated some of his data points as an interactive map and a searchable table.</p><p>That is where my idea comes from. Preparedness advice works better when it is local, and Romania has its own official guidance and its own list of civil protection shelters. So I asked what a similar checker would show for Bucharest, using only open data.</p><p>This is an independent build, not a copy. I have no access to Kashevko’s data or method. Mine uses what is openly available, namely OpenStreetMap and the IGSU shelter list, and a simple method you can adjust yourself. It is a way to think about the city, not a prediction.</p>",
  useEy: "In practice", useH: "How it can be used",
  use: "<p><b>As a starting point for a household plan.</b> Type your street to see your grade, then read the three parts behind it: how close you are to strategic sites, how far the nearest emergency hospital is, and how many civil protection shelters are within a kilometre. The “Supplies and services nearby” list shows the closest pharmacies, supermarkets, fuel stations, and the nearest fire, metro and police stations. That helps with practical questions: where to stock up, where to meet if the household is separated, which way to go first.</p><p><b>To compare places.</b> Check two addresses before renting or buying, or see how the area where a relative lives compares with yours. Teachers, journalists and local planners can use the sector table and the neighbourhood ranking, and the sliders under “Adjust the model” show how much the ranking depends on the assumptions.</p><p><b>With care.</b> A grade is relative: it ranks Bucharest’s areas against each other and says nothing about how likely any event is. Before relying on a shelter, confirm its location and access with the local authorities. For real guidance, follow the Romanian authorities (DSU / IGSU).</p>",
  find: "Find a street or neighbourhood",
  ph: "e.g. Calea Victoriei, Drumul Taberei, Floreasca",
  hint: "Street names repeat across the city, so each match shows its sector. Or click anywhere on the map.",
  noMatch: "No match. Try part of the name.",
  kArea: "Area", kStreet: "Street", sector: "Sector",
  secLbl: "Sectors", thSector: "Sector", thAvg: "Avg grade", thShel: "Shelters", thER: "ER",
  secNote: "Average grade over the sector’s map cells. Tap a row to zoom in.",
  layersLbl: "Map layers",
  ly_cells: "Grades", ly_bord: "Sector borders", ly_water: "River and lakes", ly_lab: "Labels", ly_shel: "Shelters", ly_hosp: "Hospitals", ly_site: "Strategic sites", ly_fire: "Fire stations",
  adjust: "Adjust the model", reset: "Reset to defaults",
  sl_M: "Military sites", sl_A: "Airports and airbases", sl_E: "Heat and power plants", sl_G: "Government", sl_T: "Telecom and broadcast", sl_R: "Rail hub",
  sl_rad: "Site influence radius (km)", sl_wE: "Share: strategic sites (%)", sl_wH: "Share: hospital access (%)", sl_wS: "Share: shelters (%)",
  cat_M: "Military site", cat_A: "Airport or airbase", cat_E: "Heat and power plant", cat_G: "Government", cat_T: "Telecom or broadcast", cat_R: "Rail hub",
  emerg: " (emergency)", ly_svc: "Services (zoom in)", svc_ph: "Pharmacy", svc_sm: "Supermarket", svc_fu: "Fuel station", svc_mt: "Metro station", svc_pol: "Police station",
  lm0: "Palace of Parliament", lm1: "Gara de Nord", lm2: "Băneasa airport", lm3: "Otopeni airport", lm4: "City Hall",
  zin: "Zoom in", zout: "Zoom out", zfit: "Reset view",
  mapAria: "Map of Bucharest coloured by relative emergency exposure, grades A to G",
  low: "Lowest exposure", high: "Highest",
  outH: "Outside the city", outP: "That spot is outside Bucharest’s six sectors. Pick a point inside the outline.",
  sel: "Selected point",
  sub: (sec, sc) => (sec ? "Sector " + sec + " · " : "") + "Relative exposure score " + sc + " of 100 (lower is better)",
  bSites: "Strategic sites", bHosp: "Hospital access", bShel: "Shelter gap",
  fER: "Nearest emergency hospital", none: "none mapped", fShel: "Mapped shelters within 1 km", fSites: r => "Strategic sites within " + r + " km",
  supH: "Supplies and services nearby", fPh: "Pharmacies within 1 km", fSm: "Supermarkets within 1 km", fFu: "Fuel stations within 1.5 km",
  fFire: "Nearest fire station", fMetro: "Nearest metro station", fPol: "Nearest police station",
  topH: "Biggest contributors", unnamed: "Unnamed site",
  barNote: "Bars show 0 (best) to 100 (worst) for each part. Grades are relative to the rest of Bucharest.",
  rankH: "Neighbourhood ranking", filt: "Filter", filtPh: "Type a name",
  tNb: "Neighbourhood", tGrade: "Grade", tScore: "Score", tExp: "Exposure", tEr: "Nearest ER (km)", tSh: "Shelters ≤1 km",
  n1H: "How the grade is built",
  n1: "<li><b>Exposure to strategic sites.</b> Military sites, airports, heat and power plants, ministries and Parliament, telecom towers and Gara de Nord. Each adds to a cell’s exposure, and the effect fades to zero at the chosen radius.</li><li><b>Distance to an emergency hospital.</b> Further away scores worse.</li><li><b>Civil protection shelters within 1 km.</b> More shelters nearby scores better.</li><li>The three parts are blended with the weights in “Adjust the model”, then the city’s cells are split into seven equal-width bands, A to G.</li><li>Zoomed in, the map is recalculated on a finer 100 m grid, so the shading is more detailed than the 400 m cells of the full view.</li>",
  n2H: "What it leaves out",
  n2: "<li>Population density, building structure and geography are not included. Bucharest is flat, so there are no natural barriers to rate.</li><li>OpenStreetMap is volunteer-built. A missing shelter, hospital or site on the map is missing here too.</li><li>A hospital counts as an emergency hospital when its OpenStreetMap name says “Urgență” or it carries an emergency tag. Some hospitals with emergency units may be missed.</li><li>Grades are relative. A “G” in Bucharest says nothing about how it compares with another city.</li>",
  n3H: "Data and credits",
  n3: "<li>Map data © OpenStreetMap contributors (ODbL), pulled via Overpass on 16 Nov 2026, including street names, pharmacies, supermarkets, fuel stations, metro and police stations.</li><li>Pharmacies, supermarkets and fuel stations within 50 m of each other are counted once. Street search jumps to the middle of the best-mapped stretch of each street in each sector. Long streets run through several areas, so the pin is a starting point, not the whole street. The supplies and services readout is informational and not part of the grade. Street names shown when you zoom in mark that same point.</li><li>The <span class=\"nsh\"></span> shelters are the entries mapped from the <a href=\"https://igsu.ro/Resources/Documente_Generale/Situatia_adaposturilor_de_protectie_civila.pdf\" target=\"_blank\" rel=\"noopener\">IGSU civil protection shelter list</a>.</li><li>Idea from the UK “Doomsday” postcode checker by Serhii Kashevko. This is an independent build with its own method and data.</li>",
  disc: "Unofficial tool for general awareness. It does not predict any event and is no substitute for guidance from the Romanian authorities (DSU / IGSU).",
  credit: "Researched and built with the help of Claude (Anthropic), using OpenStreetMap and the public sources above. <a href=\"/#contact\">Corrections welcome</a>."
},
it: {
  title: "Bucharest Doomsday Checker — Ion-Alexandru Giboi",
  eyebrow: "Library · Mappa · nov 2026",
  h1: "Il Doomsday Checker di Bucarest",
  lede: "Quanto è esposta la tua zona di Bucarest se scatta un’emergenza nazionale? Cerca una via o un quartiere, oppure clicca sulla mappa, per ottenere un voto da A (esposizione relativa più bassa) a G (più alta). Confronta le zone di Bucarest tra loro. Non è una previsione.",
  stamp: "Dati: OpenStreetMap ed elenco dei rifugi IGSU, scaricati il 16 nov 2026",
  whyEy: "Contesto", whyH: "Perché l’ho fatto",
  why: "<p>Quando il governo britannico ha lanciato la campagna “Be Ready”, che invita a fare scorta di beni essenziali in caso di emergenza, Serhii Kashevko, un imprenditore tecnologico arrivato nel Regno Unito allo scoppio della guerra in Ucraina, ha deciso che il consiglio doveva dipendere da dove si vive. Ha creato un “Doomsday” postcode checker che assegna a una zona un voto da A a G, tenendo conto della distanza da probabili bersagli missilistici, delle difese naturali, della struttura dell’edificio e del pronto soccorso più vicino. Il Times ha poi ricostruito alcuni dei suoi dati in una mappa interattiva e in una tabella ricercabile.</p><p>Da qui nasce la mia idea. I consigli sulla preparazione funzionano meglio se sono locali, e la Romania ha le sue indicazioni ufficiali e il suo elenco di rifugi di protezione civile. Così mi sono chiesto cosa mostrerebbe uno strumento simile per Bucarest, usando solo dati aperti.</p><p>È una realizzazione indipendente, non una copia. Non ho accesso ai dati né al metodo di Kashevko. Il mio usa ciò che è disponibile pubblicamente, cioè OpenStreetMap e l’elenco dei rifugi dell’IGSU, e un metodo semplice che puoi modificare tu stesso. È un modo per ragionare sulla città, non una previsione.</p>",
  useEy: "In pratica", useH: "A cosa può servire",
  use: "<p><b>Come punto di partenza per il piano della famiglia.</b> Scrivi la tua via per vedere il voto, poi leggi le tre componenti che lo determinano: quanto sei vicino ai siti strategici, quanto dista il pronto soccorso più vicino e quanti rifugi di protezione civile ci sono entro un chilometro. L’elenco “Approvvigionamenti e servizi vicini” mostra le farmacie, i supermercati e i distributori più vicini, oltre alle stazioni dei vigili del fuoco, della metro e della polizia. Aiuta a rispondere a domande pratiche: dove fare scorta, dove ritrovarsi se la famiglia è separata, da che parte andare per prima cosa.</p><p><b>Per confrontare i luoghi.</b> Controlla due indirizzi prima di affittare o comprare, oppure guarda come si colloca la zona in cui vive un parente rispetto alla tua. Insegnanti, giornalisti e pianificatori locali possono usare la tabella dei settori e la classifica dei quartieri, mentre i cursori di “Modifica il modello” mostrano quanto la classifica dipenda dalle ipotesi.</p><p><b>Con prudenza.</b> Il voto è relativo: mette a confronto le zone di Bucarest tra loro e non dice nulla sulla probabilità di un evento. Prima di contare su un rifugio, verifica ubicazione e accesso con le autorità locali. Per le indicazioni vere e proprie, segui le autorità rumene (DSU / IGSU).</p>",
  find: "Cerca una via o un quartiere",
  ph: "es. Calea Victoriei, Drumul Taberei, Floreasca",

  fER: "Pronto soccorso più vicino", none: "nessuno mappato", fShel: "Rifugi mappati entro 1 km", fSites: r => "Siti strategici entro " + r + " km",
  supH: "Approvvigionamenti e servizi vicini", fPh: "Farmacie entro 1 km", fSm: "Supermercati entro 1 km", fFu: "Distributori di carburante entro 1,5 km",
  fFire: "Caserma dei vigili del fuoco più vicina", fMetro: "Stazione della metro più vicina", fPol: "Stazione di polizia più vicina",
  topH: "Contributi maggiori", unnamed: "Sito senza nome",
  barNote: "Le barre vanno da 0 (migliore) a 100 (peggiore) per ciascuna componente. I voti sono relativi al resto di Bucarest.",
  rankH: "Classifica dei quartieri", filt: "Filtra", filtPh: "Scrivi un nome",
  tNb: "Quartiere", tGrade: "Voto", tScore: "Punteggio", tExp: "Esposizione", tEr: "PS più vicino (km)", tSh: "Rifugi ≤1 km",
  n1H: "Come si costruisce il voto",
  n1: "<li><b>Esposizione ai siti strategici.</b> Siti militari, aeroporti, centrali termiche ed elettriche, ministeri e Parlamento, torri di telecomunicazione e Gara de Nord. Ognuno aumenta l’esposizione di una cella, e l’effetto si azzera al raggio scelto.</li><li><b>Distanza dal pronto soccorso.</b> Più è lontano, peggiore è il punteggio.</li><li><b>Rifugi di protezione civile entro 1 km.</b> Più rifugi ci sono vicino, meglio è.</li><li>Le tre componenti si combinano con i pesi di “Modifica il modello”; poi le celle della città vengono divise in sette fasce di uguale ampiezza, da A a G.</li><li>Con lo zoom la mappa viene ricalcolata su una griglia più fine, di 100 m, quindi le sfumature sono più dettagliate rispetto alle celle da 400 m della vista completa.</li>",
  n2H: "Cosa non include",
  n2: "<li>Densità di popolazione, struttura degli edifici e geografia non sono inclusi. Bucarest è pianeggiante, quindi non ci sono barriere naturali da valutare.</li><li>OpenStreetMap è costruita da volontari. Un rifugio, un ospedale o un sito che manca sulla mappa manca anche qui.</li><li>Un ospedale conta come ospedale con pronto soccorso quando il suo nome su OpenStreetMap contiene “Urgență” o ha un’etichetta di emergenza. Alcuni ospedali con un’unità di emergenza potrebbero non essere rilevati.</li><li>I voti sono relativi. Una “G” a Bucarest non dice nulla su come la città si confronti con un’altra.</li>",
  n3H: "Dati e crediti",
  n3: "<li>Dati della mappa © contributori di OpenStreetMap (ODbL), ottenuti tramite Overpass il 16 nov 2026, compresi nomi delle vie, farmacie, supermercati, distributori, stazioni della metro e della polizia.</li><li>Farmacie, supermercati e distributori a meno di 50 m l’uno dall’altro sono contati una sola volta. La ricerca per via porta al centro del tratto meglio mappato di ciascuna via in ciascun settore. Le vie lunghe attraversano più zone, quindi il segnaposto è un punto di partenza, non l’intera via. L’elenco di approvvigionamenti e servizi è solo informativo e non entra nel voto. I nomi delle vie visibili con lo zoom indicano lo stesso punto.</li><li>I <span class=\"nsh\"></span> rifugi sono le voci mappate a partire dall’<a href=\"https://igsu.ro/Resources/Documente_Generale/Situatia_adaposturilor_de_protectie_civila.pdf\" target=\"_blank\" rel=\"noopener\">elenco dei rifugi di protezione civile dell’IGSU</a>.</li><li>L’idea nasce dal “Doomsday” postcode checker britannico di Serhii Kashevko. Questa è una realizzazione indipendente, con metodo e dati propri.</li>",
  disc: "Strumento non ufficiale, a scopo di sensibilizzazione generale. Non prevede alcun evento e non sostituisce le indicazioni delle autorità rumene (DSU / IGSU).",
  credit: "Ricerca e pagina realizzate con l’aiuto di Claude (Anthropic), con OpenStreetMap e le fonti pubbliche indicate sopra. <a href=\"/#contact\">Le correzioni sono benvenute</a>."

ro: {
  title: "Bucharest Doomsday Checker — Ion-Alexandru Giboi",
  eyebrow: "Library · Hartă · nov. 2026",
  h1: "Doomsday Checker pentru București",
  lede: "Cât de expusă este zona ta din București în cazul unei urgențe naționale? Caută o stradă sau un cartier, ori dă clic pe hartă, pentru o clasificare de la A (expunere relativă cea mai mică) la G (cea mai mare). Compară zonele Bucureștiului între ele. Aceasta nu este o prognoză despre cât de probabil este ca o urgență națională să aibă loc.",
  stamp: "Date: OpenStreetMap și lista adăposturilor IGSU, preluate la 16 nov. 2026",
  whyEy: "Context", whyH: "De ce am făcut asta",
  why: "<p>Când guvernul britanic a lansat campania „Be Ready”, prin care îndeamnă oamenii să facă provizii pentru situații de urgență, Serhii Kashevko, un antreprenor din tehnologie ajuns în Regatul Unit odată cu izbucnirea războiului din Ucraina, a hotărât că sfatul trebuie adaptat la locul în care locuiești. A creat un verificator „Doomsday” după codul poștal, care dă unei zone o clasificare de la A la G, ținând cont de distanța față de posibile ținte de rachete, de apărarea naturală, de structura clădirii și de cea mai apropiată unitate de urgență. The Times a recreat apoi o parte din datele lui într-o hartă interactivă și într-un tabel în care se poate căuta.</p><p>De aici vine ideea mea. Sfaturile de pregătire funcționează mai bine când sunt locale, iar România are propriile recomandări oficiale și propria listă de adăposturi de protecție civilă. Așa că m-am întrebat ce ar arăta un instrument asemănător pentru București, folosind doar date deschise.</p><p>Este o realizare independentă, nu o copie. Nu am acces la datele sau la metoda lui Kashevko. A mea folosește ce este disponibil public, adică OpenStreetMap și lista adăposturilor IGSU, plus o metodă simplă pe care o poți ajusta singur. Este un mod de a privi orașul, nu o prognoză.</p>",
  useEy: "În practică", useH: "La ce poate folosi",
  use: "<p><b>Ca punct de pornire pentru planul familiei.</b> Scrie strada ta ca să vezi clasificarea, apoi citește cele trei componente din spatele ei: cât de aproape ești de obiective strategice, cât de departe este cel mai apropiat spital cu urgențe și câte adăposturi de protecție civilă sunt pe o rază de un kilometru. Lista „Aprovizionare și servicii în apropiere” arată cele mai apropiate farmacii, supermarketuri și benzinării, plus stațiile de pompieri, de metrou și secțiile de poliție din apropiere. Te ajută la întrebări practice: unde îți faci proviziile, unde vă întâlniți dacă familia se desparte, în ce direcție pornești mai întâi.</p><p><b>Ca să compari locuri.</b> Verifică două adrese înainte să închiriezi sau să cumperi, sau vezi cum stă zona în care locuiește o rudă față de a ta. Profesorii, jurnaliștii și planificatorii locali pot folosi tabelul sectoarelor și clasamentul cartierelor, iar cursoarele de la „Ajustează modelul” arată cât depinde clasamentul de ipoteze.</p><p><b>Cu grijă.</b> Clasificarea este relativă: compară zonele Bucureștiului între ele și nu spune nimic despre cât de probabil este un eveniment. Înainte să te bazezi pe un adăpost, confirmă-i locația și accesul la autoritățile locale. Pentru indicații reale, urmează recomandările autorităților române (DSU / IGSU).</p>",
  find: "Caută o stradă sau un cartier",
  ph: "ex. Calea Victoriei, Drumul Taberei, Floreasca",
  hint: "Numele străzilor se repetă în oraș, așa că fiecare rezultat arată sectorul. Sau dă clic oriunde pe hartă.",
  noMatch: "Niciun rezultat. Încearcă o parte din nume.",
  kArea: "Zonă", kStreet: "Stradă", sector: "Sector",

  adjust: "Ajustează modelul", reset: "Revino la valorile implicite",
  sl_M: "Obiective militare", sl_A: "Aeroporturi și baze aeriene", sl_E: "Centrale termice și electrice", sl_G: "Instituții guvernamentale", sl_T: "Telecomunicații și radiodifuziune", sl_R: "Nod feroviar",

  supH: "Aprovizionare și servicii în apropiere", fPh: "Farmacii pe o rază de 1 km", fSm: "Supermarketuri pe o rază de 1 km", fFu: "Benzinării pe o rază de 1,5 km",
  fFire: "Cea mai apropiată stație de pompieri", fMetro: "Cea mai apropiată stație de metrou", fPol: "Cea mai apropiată secție de poliție",
  topH: "Cei mai mari contribuitori", unnamed: "Obiectiv fără nume",
  barNote: "Barele merg de la 0 (cel mai bine) la 100 (cel mai rău) pentru fiecare componentă. Clasificarea este relativă la restul Bucureștiului.",
  rankH: "Clasamentul cartierelor", filt: "Filtrează", filtPh: "Scrie un nume",
  tNb: "Cartier", tGrade: "Clasă", tScore: "Scor", tExp: "Expunere", tEr: "UPU cel mai apropiat (km)", tSh: "Adăposturi ≤1 km",
  n1H: "Cum se construiește clasificarea",
  n1: "<li><b>Expunerea la obiective strategice.</b> Unități militare, aeroporturi, centrale termice și electrice, ministere și Parlament, turnuri de telecomunicații și Gara de Nord. Fiecare crește expunerea unei celule, iar efectul scade la zero la raza aleasă.</li><li><b>Distanța până la un spital cu urgențe.</b> Cu cât e mai departe, cu atât scorul e mai slab.</li><li><b>Adăposturi de protecție civilă pe o rază de 1 km.</b> Cu cât sunt mai multe în apropiere, cu atât scorul e mai bun.</li><li>Cele trei componente se combină cu ponderile din „Ajustează modelul”, apoi celulele orașului sunt împărțite în șapte intervale egale, de la A la G.</li><li>Când mărești harta, ea este recalculată pe o grilă mai fină, de 100 m, așa că nuanțele sunt mai detaliate decât celulele de 400 m din vederea de ansamblu.</li>",
  n2H: "Ce nu include",
  n2: "<li>Densitatea populației, structura clădirilor și geografia nu sunt incluse. Bucureștiul este un oraș de câmpie, deci nu există bariere naturale de evaluat.</li><li>OpenStreetMap este construită de voluntari. Un adăpost, un spital sau un obiectiv care lipsește de pe hartă lipsește și aici.</li><li>Un spital este considerat spital cu urgențe când numele lui din OpenStreetMap conține „Urgență” sau are o etichetă de urgență. Unele spitale cu unități de urgență pot lipsi.</li><li>Clasificarea este relativă. Un „G” în București nu spune nimic despre cum se compară orașul cu altul.</li>",
  n3H: "Date și credite",
  n3: "<li>Date hartă © contribuitorii OpenStreetMap (ODbL), obținute prin Overpass la 16 nov. 2026, inclusiv numele străzilor, farmacii, supermarketuri, benzinării, stații de metrou și secții de poliție.</li><li>Farmaciile, supermarketurile și benzinăriile aflate la mai puțin de 50 m una de alta sunt numărate o singură dată. Căutarea după stradă duce în mijlocul porțiunii celei mai bine cartografiate din fiecare stradă, în fiecare sector. Străzile lungi traversează mai multe zone, deci marcajul este un punct de pornire, nu întreaga stradă. Lista de aprovizionare și servicii are doar rol informativ și nu intră în clasificare. Numele străzilor afișate la mărire marchează același punct.</li><li>Cele <span class=\"nsh\"></span> de adăposturi sunt intrările cartografiate din <a href=\"https://igsu.ro/Resources/Documente_Generale/Situatia_adaposturilor_de_protectie_civila.pdf\" target=\"_blank\" rel=\"noopener\">lista adăposturilor de protecție civilă a IGSU</a>.</li><li>Ideea pornește de la verificatorul britanic „Doomsday” după codul poștal, creat de Serhii Kashevko. Aceasta este o realizare independentă, cu metodă și date proprii.</li>",

  if (VB[2] > 240) SECS.forEach(s => { const x = px(s.lo), y = py(s.la); TX(T("sector").toUpperCase(), x, y - 30 * u, { size: 11, w: 700, ls: ".12em", op: .85 }); TX(String(s.k), x, y + 18 * u, { size: 44, w: 700, op: .8, sw: 4 }); });

const setVB = () => { svg.setAttribute("viewBox", VB.map(v => v.toFixed(1)).join(" ")); svg.style.setProperty("--ms", Math.max(.3, Math.min(1, Math.pow(VB[2] / 953, .55))).toFixed(3)); drawLabels(); drawFine(); drawSvc(); };
