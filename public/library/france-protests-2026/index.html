  trList:"<li>Ahead of 17 October, the US Embassy in Paris warned that marches could disrupt travel routes and that demonstrations can trigger last-minute closures of metro and rail. "+A(U.emb,"US Embassy alert")+"</li>"+

   "<li>Places visitors know that were damaged: the Hôtel de Ville in Limoges (a listed historic monument), the tourist office pavilion on Place Bellecour in Lyon, the Grand'Place in Lille and Place de la République in Paris.</li>"+
   "<li>Stay away from marches and gatherings, allow extra time on public transport, and follow police instructions.</li>"+
   "<li>Check your own government's advice before you go: "+A(U.ch,"Switzerland (FDFA)")+", "+A(U.it,"Italy (Viaggiare Sicuri)")+", "+A(U.ro,"Romania (MAE)")+", "+A(U.uk,"United Kingdom (FCDO)")+", "+A(U.us,"United States")+".</li>",
  trNote:"This section goes out of date fastest. Use it as a starting point, not as current advice.",
  fgEy:"National figures", fgH:"How the count moved",
  fgNote:"Arrest and injury totals for 17 October rose as more reports came in. Each row is the figure as published at that time.",
  fgTable:table("en",["Published","Arrests","Officers injured","Source"],[
   ["17 Oct, daytime","≈400","–","AP, cited in "+A(WIKI,"Wikipedia")+" "+vf("en",1)],
   ["17–18 Oct","1,200","150","PM Lecornu, via "+A(U.cnn,"CNN")+" "+vf("en",0)],
   ["18 Oct","≈1,800<br><span class=\"note\">855 in Paris</span>","500+<br><span class=\"note\">incl. firefighters</span>","Interior Minister Nuñez, via "+A(U.aj,"Al Jazeera")+"; Paris figure from the police prefecture via "+A(U.ici,"ICI")+" "+vf("en",0)],
   ["19 Oct","≈2,400","≈1,000<br><span class=\"note\">7 seriously</span>","Interior Ministry, via BBC, cited in "+A(WIKI,"Wikipedia")+" "+vf("en",1)]]),
  fgNote2:"Turnout on 17 Oct: 550,000 according to the authorities (110,000 in Paris), 800,000 according to organisers ("+A(U.cbs,"AP via CBS")+"). Earlier, on 1 Oct, the Interior Ministry reported 1,949 arrests in a single day of school blockades.",
  exEy:"Left off the map", exH:"Reports we did not include",
  exList:"<li><b>An elderly couple robbed in Paris near the Élysée.</b> Only one outlet reported it, and only as unconfirmed.</li><li><b>A police officer killed in Nantes on 17 Oct.</b> He was hit by a car during a separate police operation; the driver was not connected to the protests.</li><li><b>A protester's death in Paris</b> after a cardiac arrest. Police gave no further details, so we cannot place or describe it reliably.</li><li><b>Burned cars on rue Saint-Denis, Paris.</b> Seen only in photo captions, with no report to cite.</li><li><b>University marches in Argentina</b> against funding cuts. AP reported them, but we could not pin down the date, and they are not linked to the European protests.</li><li><b>Education protests in Germany and Austria.</b> Reported without enough detail on dates and places to map them.</li>",
  mtEy:"Method", mtH:"How entries were checked",
  mtBody:"<p>Entries come from wire agencies (AFP, AP, Reuters), public broadcasters (France 24, ICI, BBC) and established national and regional newspapers. Each entry carries one of two labels:</p><ul><li>"+vf("en",0)+" We read the report itself, from the agency or the outlet that carried it.</li><li>"+vf("en",1)+" The facts come from another outlet's report, mostly Wikipedia's article on the French protests. The original report is named but we have not opened it. Treat these with more caution.</li></ul><p>Figures are given as the source gave them. Where sources disagree, the entry says so. Locations are placed at the city, square or school named in the report.</p>",
  srcH:"Sources", credit:"Researched and built with the help of Claude (Anthropic), from the reports linked on each entry. <a href=\"/#contact\">Corrections welcome</a>."
 },
 it:{
  eyebrow:"Biblioteca · Mappa · ott 2026", h1:"Le proteste dell'autunno 2026: la Francia e oltre",
  frH:"Francia: dove le proteste sono degenerate", byH:"Oltre la Francia",
  byLede:"Nelle stesse settimane, proteste per le condizioni delle scuole, i bilanci dell'istruzione e il caro vita sono nate anche in altri Paesi europei. Questa mappa è meno dettagliata di quella sulla Francia: una voce per Paese, con i soli eventi principali. Il colore indica se gli organizzatori hanno collegato la protesta alla Francia.",
  euNote:"Contorno semplificato dell'Europa, solo per orientarsi. Seleziona un Paese per leggerne la voce, oppure la Francia per tornare alla mappa dettagliata. Non abbiamo trovato proteste collegate fuori dall'Europa che potessimo datare e documentare in modo affidabile.",
  euAria:"Mappa dell'Europa con un segnaposto per ogni Paese in cui sono state segnalate proteste collegate", frMarker:"Francia: vai alla mappa dettagliata", frLegend:"Francia, in dettaglio sopra", euAll:"Tutti i Paesi", euCount:n=>n+(n===1?" Paese":" Paesi"), euClear:"Mostra tutti i Paesi",
  lede:"Da fine settembre, le proteste per le condizioni delle scuole e il caro vita hanno attraversato la Francia, e movimenti simili sono nati altrove in Europa. La mappa principale mostra dove i disordini francesi sono degenerati in violenza, dai primi blocchi delle scuole a Créteil, il 21 settembre, alla giornata nazionale di mobilitazione di <strong>sabato 17 ottobre</strong>, quando hanno manifestato circa 550.000 persone. La maggior parte dei manifestanti è rimasta pacifica. Una seconda mappa, più sintetica, riguarda le proteste collegate in altri Paesi. Ogni voce rimanda alla sua fonte.",
  stamp1:"Ultimo controllo <b>19 ott 2026, 13:30 CEST</b>", stamp2:"Eventi sulla mappa", stamp3:"Ogni voce rimanda alla sua fonte",

  insetH:"Dettaglio: regione di Parigi", insetNote:"Riquadro tratteggiato sulla mappa principale. Il contorno di Parigi è approssimativo.",
  mapNote:"Contorno semplificato, disegnato solo per orientarsi. La dimensione del segnaposto cresce con il numero di voci; il colore indica il tipo più grave in quel luogo. Seleziona un segnaposto per leggerne le voci.",
  mapAria:"Mappa della Francia metropolitana con un segnaposto per ogni città in cui sono stati segnalati episodi", insetAria:"Mappa di dettaglio della regione di Parigi",
  noInset:"Nessuna voce per la regione di Parigi con questo filtro",
  allPlaces:"Tutti i luoghi", clear:"Mostra tutti i luoghi", one:"1 voce", many:n=>n+" voci", order:", dalla più recente", entriesAria:n=>n+(n===1?" voce":" voci"),
  empty:"Nessuna voce corrisponde ai filtri. Scegli un altro periodo o attiva altri tipi.",
  vfChecked:"Abbiamo letto direttamente l'articolo", vfCited:"Ripreso dall'articolo di un'altra testata; originale non consultato", orig:"originale",
  months:["","gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"],
  trEy:"Per chi viaggia · al 19 ottobre", trH:"Se state pianificando un viaggio in Francia",
  trList:"<li>In vista del 17 ottobre, l'Ambasciata degli Stati Uniti a Parigi ha avvertito che i cortei potevano ostacolare gli spostamenti e che le manifestazioni possono provocare chiusure improvvise di metro e treni. "+A(U.emb,"Avviso dell'Ambasciata USA")+"</li>"+
   "<li>Le tensioni sono proseguite domenica 18 ottobre: un nuovo raduno in Place de la République a Parigi è stato teso, e la BBC ha riferito che saccheggi e scontri sono continuati su scala minore a Parigi e Lione (citato su "+A(WIKI,"Wikipedia")+").</li>"+
   "<li>Luoghi noti ai visitatori che sono stati danneggiati: l'Hôtel de Ville di Limoges (monumento storico tutelato), il padiglione dell'ufficio del turismo in Place Bellecour a Lione, la Grand'Place di Lille e Place de la République a Parigi.</li>"+
   "<li>State lontani da cortei e assembramenti, prevedete più tempo per i trasporti pubblici e seguite le indicazioni della polizia.</li>"+
   "<li>Prima di partire, consultate le indicazioni del vostro governo: "+A(U.ch,"Svizzera (DFAE)")+", "+A(U.it,"Italia (Viaggiare Sicuri)")+", "+A(U.ro,"Romania (MAE)")+", "+A(U.uk,"Regno Unito (FCDO)")+", "+A(U.us,"Stati Uniti")+".</li>",

  fgNote:"I totali di arresti e feriti del 17 ottobre sono cresciuti man mano che arrivavano nuovi dati. Ogni riga riporta la cifra pubblicata in quel momento.",

   ["17 ott, in giornata","≈400","–","AP, citato su "+A(WIKI,"Wikipedia")+" "+vf("it",1)],
   ["17–18 ott","1.200","150","Il premier Lecornu, via "+A(U.cnn,"CNN")+" "+vf("it",0)],
   ["18 ott","≈1.800<br><span class=\"note\">855 a Parigi</span>","500+<br><span class=\"note\">inclusi i vigili del fuoco</span>","Il ministro dell'Interno Nuñez, via "+A(U.aj,"Al Jazeera")+"; il dato di Parigi è della prefettura di polizia, via "+A(U.ici,"ICI")+" "+vf("it",0)],
   ["19 ott","≈2.400","≈1.000<br><span class=\"note\">7 gravi</span>","Ministero dell'Interno, via BBC, citato su "+A(WIKI,"Wikipedia")+" "+vf("it",1)]]),
  fgNote2:"Partecipazione il 17 ottobre: 550.000 secondo le autorità (110.000 a Parigi), 800.000 secondo gli organizzatori ("+A(U.cbs,"AP via CBS")+"). In precedenza, il 1° ottobre, il ministero dell'Interno aveva registrato 1.949 arresti in un solo giorno di blocchi delle scuole.",
  exEy:"Esclusi dalla mappa", exH:"Notizie che non abbiamo incluso",
  exList:"<li><b>Una coppia di anziani derubata a Parigi vicino all'Eliseo.</b> Ne ha parlato un solo organo di stampa, e solo come notizia non confermata.</li><li><b>Un agente di polizia morto a Nantes il 17 ottobre.</b> È stato investito da un'auto durante un'operazione di polizia separata; il conducente non era legato alle proteste.</li><li><b>La morte di un manifestante a Parigi</b> dopo un arresto cardiaco. La polizia non ha fornito altri dettagli, quindi non possiamo collocarla né descriverla in modo affidabile.</li><li><b>Auto bruciate in rue Saint-Denis, a Parigi.</b> Viste solo nelle didascalie di alcune foto, senza un articolo da citare.</li><li><b>Cortei universitari in Argentina</b> contro i tagli ai fondi. Ne ha dato notizia AP, ma non siamo riusciti a stabilire la data, e non sono legati alle proteste europee.</li><li><b>Proteste per l'istruzione in Germania e Austria.</b> Riportate senza dettagli sufficienti su date e luoghi per inserirle nella mappa.</li>",
  mtEy:"Metodo", mtH:"Come abbiamo verificato le voci",
  mtBody:"<p>Le voci provengono da agenzie di stampa (AFP, AP, Reuters), emittenti pubbliche (France 24, ICI, BBC) e testate nazionali e regionali affermate. Ogni voce porta una di due etichette:</p><ul><li>"+vf("it",0)+" Abbiamo letto direttamente l'articolo, dall'agenzia o dalla testata che lo ha pubblicato.</li><li>"+vf("it",1)+" I fatti provengono dall'articolo di un'altra testata, per lo più la voce di Wikipedia sulle proteste in Francia. L'originale è indicato ma non lo abbiamo consultato. Vanno considerati con più cautela.</li></ul><p>Le cifre sono riportate come le ha date la fonte. Dove le fonti divergono, la voce lo indica. I luoghi sono posizionati sulla città, piazza o scuola indicata nell'articolo.</p>",
  srcH:"Fonti", credit:"Ricerca e pagina realizzate con l'aiuto di Claude (Anthropic), sulla base degli articoli indicati per ogni voce. <a href=\"/#contact\">Le correzioni sono benvenute</a>."
 },

  trList:"<li>Înainte de 17 octombrie, Ambasada SUA la Paris a avertizat că marșurile pot perturba traseele de călătorie și că manifestațiile pot duce la închideri de ultim moment ale metroului și trenurilor. "+A(U.emb,"Alerta Ambasadei SUA")+"</li>"+

 {d:"2026-09-21",g:"Paris region",ig:"Créteil",place:"Créteil",spot:"Lycée Antoine-de-Saint-Exupéry",t:"school",src:["actu","wiki"],v:"cited",
  title:{en:"The movement starts in Créteil",it:"Il movimento nasce a Créteil",ro:"Mișcarea pornește din Créteil"},
  text:{en:"Pupils protest over unfilled teaching posts, overcrowded classes and rooms short of tables. Within days, blockades spread to schools across Seine-Saint-Denis and Val-de-Marne.",
   it:"Gli studenti protestano per le cattedre scoperte, le classi sovraffollate e le aule senza banchi a sufficienza. In pochi giorni i blocchi si estendono alle scuole della Seine-Saint-Denis e della Val-de-Marne.",
   ro:"Elevii protestează față de posturile de profesori neocupate, clasele supraaglomerate și sălile fără suficiente bănci. În câteva zile, blocadele se extind la liceele din Seine-Saint-Denis și Val-de-Marne."}},
 {d:"2026-09-28",g:"Paris region",ig:"Saint-Ouen-l'Aumône",place:"Saint-Ouen-l'Aumône",spot:"Val-d'Oise",t:"injury",src:["kt","wiki"],v:"cited",
  title:{en:"Pupil's jaw broken by tear gas grenade",it:"Mascella rotta da un lacrimogeno",ro:"Elev cu maxilarul rupt de o grenadă lacrimogenă"},
  text:{en:"A 14-year-old was hit in the face by a tear gas grenade fired at close range and lost several teeth. A police officer was charged over the incident on 6 October.",
   it:"Un ragazzo di 14 anni è stato colpito al volto da una granata lacrimogena sparata a distanza ravvicinata e ha perso diversi denti. Il 6 ottobre un agente è stato incriminato per l'episodio.",
   ro:"Un băiat de 14 ani a fost lovit în față de o grenadă lacrimogenă trasă de la mică distanță și și-a pierdut mai mulți dinți. Pe 6 octombrie, un polițist a fost pus sub acuzare pentru incident."}},
 {d:"2026-09-30",g:"Tours",place:"Tours",spot:"Lycée Grandmont",t:"injury",src:["wiki"],v:"cited",
  title:{en:"Student loses the use of an eye",it:"Uno studente perde l'uso di un occhio",ro:"Un elev își pierde vederea la un ochi"},
  text:{en:"A 16-year-old was injured during a blockade. The Tours prosecutor said the injury was consistent with a rubber-bullet (LBD) round, and the police inspectorate opened an inquiry.",
   it:"Un sedicenne è rimasto ferito durante un blocco. La procura di Tours ha detto che la ferita è compatibile con un proiettile di gomma (LBD) e l'ispettorato di polizia ha aperto un'indagine.",
   ro:"Un tânăr de 16 ani a fost rănit în timpul unei blocade. Procurorul din Tours a declarat că rana corespunde unui proiectil de cauciuc (LBD), iar inspectoratul poliției a deschis o anchetă."}},
 {d:"2026-10-01",g:"Nantes",place:"Nantes",spot:"Lycée Nelson-Mandela",t:"arson",src:["wiki"],v:"cited",orig:"franceinfo, Ouest-France",
  title:{en:"Fire spreads into a school entrance hall",it:"Un incendio raggiunge l'atrio di una scuola",ro:"Un incendiu ajunge în holul unui liceu"},
  text:{en:"A deliberate fire started on the façade and reached the entrance hall. About 50 firefighters attended; no one was hurt. The school said it would stay shut until the All Saints' holiday.",
   it:"Un incendio doloso è partito dalla facciata e ha raggiunto l'atrio. Sono intervenuti circa 50 vigili del fuoco; nessun ferito. La scuola ha comunicato che resterà chiusa fino alle vacanze di Ognissanti.",
   ro:"Un incendiu provocat intenționat a pornit de pe fațadă și a ajuns în holul de la intrare. Au intervenit aproximativ 50 de pompieri; nu au existat victime. Liceul a anunțat că rămâne închis până la vacanța de Ziua Tuturor Sfinților."}},
 {d:"2026-10-01",g:"Marseille",place:{en:"Marseille, 15th arr.",it:"Marsiglia, 15° arr.",ro:"Marsilia, arondismentul 15"},spot:"Lycée Saint-Exupéry",t:"arson",src:["wiki"],v:"cited",orig:"BFM, RTL, franceinfo",
  title:{en:"Fire engine set alight",it:"Camion dei pompieri dato alle fiamme",ro:"Autospecială de pompieri incendiată"},
  text:{en:"Crowds forced the crew of a marine firefighters' engine, called to a rubbish fire, to leave the vehicle, which was then burned. One firefighter was slightly hurt.",
   it:"La folla ha costretto l'equipaggio di un'autopompa dei marinai-pompieri, chiamata per un incendio di rifiuti, ad abbandonare il mezzo, che è stato poi bruciato. Un vigile del fuoco è rimasto leggermente ferito.",
   ro:"Mulțimea a forțat echipajul unei autospeciale a pompierilor marinei, chemată la un foc de gunoaie, să părăsească vehiculul, care a fost apoi incendiat. Un pompier a fost ușor rănit."}},
 {d:"2026-10-01",g:"Marseille",place:{en:"Marseille, 14th arr.",it:"Marsiglia, 14° arr.",ro:"Marsilia, arondismentul 14"},spot:"Lycée La Floride",t:"arson",src:["wiki"],v:"cited",orig:"Marsactu, Reuters",
  title:{en:"Bus burned; city network halted",it:"Bus incendiato; rete cittadina ferma",ro:"Autobuz incendiat; transportul din oraș, oprit"},
  text:{en:"A bus was set on fire beside the school and a driver assaulted. The transport operator RTM stopped its entire network after attacks on buses near schools in the north and east of the city.",
   it:"Un autobus è stato incendiato accanto alla scuola e un autista aggredito. L'azienda dei trasporti RTM ha fermato l'intera rete dopo gli attacchi ai bus vicino alle scuole nel nord e nell'est della città.",
   ro:"Un autobuz a fost incendiat lângă liceu, iar un șofer a fost agresat. Operatorul de transport RTM a oprit întreaga rețea după atacuri asupra autobuzelor din apropierea liceelor din nordul și estul orașului."}},
 {d:"2026-10-01",g:"Rennes",place:"Rennes",spot:"Lycée Bréquigny",t:"school",src:["wiki"],v:"cited",orig:"Ouest-France",
  title:{en:"School entered and main gate burned",it:"Scuola invasa e cancello principale bruciato",ro:"Liceu invadat, poarta principală incendiată"},
  text:{en:"People got into the building, broke windows and set fire to the gate on avenue Georges-Graff. Seven people were arrested.",
   it:"Alcune persone sono entrate nell'edificio, hanno rotto finestre e dato fuoco al cancello su avenue Georges-Graff. Sette persone sono state arrestate.",
   ro:"Mai multe persoane au intrat în clădire, au spart geamuri și au dat foc porții de pe avenue Georges-Graff. Șapte persoane au fost arestate."}},
 {d:"2026-10-02",g:"Paris region",ig:"Paris",place:{en:"Paris, 13th arr.",it:"Parigi, 13° arr.",ro:"Paris, arondismentul 13"},spot:"Lycée Gaston-Bachelard",t:"arson",src:["wiki"],v:"cited",orig:"Le Figaro, Le Parisien, franceinfo",
  title:{en:"Bin fire blows out school windows",it:"Un incendio di cassonetti fa esplodere le vetrate di una scuola",ro:"Un incendiu de tomberon sparge geamurile unui liceu"},
  text:{en:"A bin fire spread to the façade early in the morning and the entrance windows burst. Paris firefighters put it out at about 07:55. Fires were also set at gates of schools in the 15th.",
   it:"Un cassonetto in fiamme ha propagato il fuoco alla facciata nelle prime ore del mattino e le vetrate dell'ingresso sono esplose. I vigili del fuoco di Parigi l'hanno spento verso le 7:55. Incendi sono stati appiccati anche ai cancelli di scuole del 15° arrondissement.",
   ro:"Focul pornit într-un tomberon s-a extins la fațadă dis-de-dimineață, iar geamurile de la intrare au explodat. Pompierii din Paris l-au stins în jurul orei 7:55. Au fost incendiate și porțile unor licee din arondismentul 15."}},
 {d:"2026-10-02",g:"Paris region",ig:"Meaux",place:"Meaux",spot:"Lycée Henri-Moissan",t:"arson",src:["wiki"],v:"cited",orig:"RTL",
  title:{en:"Serious fire at a school",it:"Grave incendio in una scuola",ro:"Incendiu grav la un liceu"},
  text:{en:"The headteacher said the façade, entrance hall, part of the canteen and some boarding rooms burned, with damage running into millions of euros.",
   it:"Secondo il preside, sono bruciati la facciata, l'atrio, parte della mensa e alcune camere del convitto, con danni per milioni di euro.",
   ro:"Potrivit directorului, au ars fațada, holul de la intrare, o parte din cantină și câteva camere din internat, iar pagubele se ridică la milioane de euro."}},
 {d:"2026-10-02",g:"Lyon",place:{en:"Lyon",it:"Lione",ro:"Lyon"},spot:{en:"Lycée Édouard-Herriot, Foch district",it:"Lycée Édouard-Herriot, quartiere Foch",ro:"Lycée Édouard-Herriot, cartierul Foch"},t:"clash",src:["wiki"],v:"cited",orig:"Le Figaro, AFP",
  title:{en:"Mortar fire and tear gas by a school",it:"Mortaretti e lacrimogeni vicino a una scuola",ro:"Petarde și gaze lacrimogene lângă un liceu"},
  text:{en:"Firework mortars were fired around 10:00 and police answered with tear gas. 44 schools in the Rhône department were closed that day.",
   it:"Verso le 10:00 sono stati lanciati mortaretti pirotecnici e la polizia ha risposto con i lacrimogeni. Quel giorno nel dipartimento del Rodano erano chiuse 44 scuole.",
   ro:"În jurul orei 10:00 au fost trase petarde de tip mortier, iar poliția a răspuns cu gaze lacrimogene. În acea zi, 44 de licee din departamentul Rhône au fost închise."}},
 {d:"2026-10-05",g:"Lens",place:"Lens",spot:"Lycée Auguste-Béhal",t:"injury",src:["kt","armen"],v:"checked",
  title:{en:"Teenager's hand blown off by police grenade",it:"Un ragazzo perde una mano per una granata della polizia",ro:"Un adolescent își pierde mâna din cauza unei grenade a poliției"},
  text:{en:"A 15-year-old lost his hand when a police grenade exploded during a blockade. Authorities said he picked it up; students said he was hit directly. Two days later the Interior Minister suspended stun grenades at school protests.",
   it:"Un quindicenne ha perso una mano quando una granata della polizia è esplosa durante un blocco. Le autorità hanno detto che l'aveva raccolta; gli studenti, che è stato colpito direttamente. Due giorni dopo il ministro dell'Interno ha sospeso l'uso delle granate stordenti alle proteste studentesche.",
   ro:"Un băiat de 15 ani și-a pierdut mâna când o grenadă a poliției a explodat în timpul unei blocade. Autoritățile au spus că a ridicat-o de jos; elevii, că a fost lovit direct. Două zile mai târziu, ministrul de Interne a suspendat folosirea grenadelor asurzitoare la protestele elevilor."}},
 {d:"2026-10-06",g:"Paris region",ig:"Paris",place:{en:"Paris, 5th arr.",it:"Parigi, 5° arr.",ro:"Paris, arondismentul 5"},spot:{en:"Sorbonne",it:"Sorbona",ro:"Sorbona"},t:"march",src:["wiki"],v:"cited",orig:"Euronews, The Conversation",
  title:{en:"Third national day; universities join",it:"Terza giornata nazionale; si uniscono le università",ro:"A treia zi națională; universitățile se alătură"},
  text:{en:"Schools and campuses including the Sorbonne were blocked from early morning. The government counted 250,000 marchers nationwide; unions said 450,000.",
   it:"Dal primo mattino sono state bloccate scuole e università, tra cui la Sorbona. Il governo ha contato 250.000 manifestanti in tutto il Paese; i sindacati 450.000.",
   ro:"Licee și campusuri, inclusiv Sorbona, au fost blocate de dimineață. Guvernul a numărat 250.000 de manifestanți la nivel național; sindicatele, 450.000."}},
 {d:"2026-10-08",g:"Bordeaux",place:{en:"Lormont, near Bordeaux",it:"Lormont, vicino a Bordeaux",ro:"Lormont, lângă Bordeaux"},spot:"Lycée Les Iris",t:"school",src:["sud"],v:"checked",
  title:{en:"School partly ransacked",it:"Scuola in parte devastata",ro:"Liceu parțial devastat"},
  text:{en:"An intrusion during the student day left damage estimated at several hundred thousand euros: smashed windows, overturned desks and broken computers.",
   it:"Un'intrusione durante la giornata studentesca ha causato danni stimati in diverse centinaia di migliaia di euro: finestre rotte, banchi rovesciati e computer distrutti.",
   ro:"O intruziune în ziua de mobilizare a elevilor a provocat pagube estimate la câteva sute de mii de euro: geamuri sparte, bănci răsturnate și calculatoare distruse."}},
 {d:"2026-10-08",g:"Bordeaux",place:"Bordeaux",spot:CC,t:"arson",src:["sud"],v:"checked",
  title:{en:"Fire outside a police station",it:"Incendio davanti a un commissariato",ro:"Incendiu în fața unei secții de poliție"},
  text:{en:"After a calm march of 2,800 people (prefecture figure), groups lit bin fires in the centre. A fire set outside a branch of the central police station damaged its façade.",
   it:"Dopo un corteo tranquillo di 2.800 persone (dato della prefettura), alcuni gruppi hanno incendiato cassonetti in centro. Un fuoco appiccato davanti a una sede del commissariato centrale ne ha danneggiato la facciata.",
   ro:"După un marș liniștit de 2.800 de persoane (cifra prefecturii), grupuri de persoane au dat foc tomberoanelor din centru. Un foc aprins în fața unei filiale a comisariatului central i-a avariat fațada."}},
 {d:"2026-10-13",g:"Paris region",ig:"Saint-Denis",place:"Saint-Denis",spot:"Lycée Paul-Éluard",t:"march",src:["wiki"],v:"cited",
  title:{en:"Fifth national day of action",it:"Quinta giornata nazionale di mobilitazione",ro:"A cincea zi națională de mobilizare"},
  text:{en:"The Interior Ministry counted 161,500 marchers nationwide; youth unions said 480,000. Greta Thunberg visited demonstrators outside this school, an early centre of the movement.",
   it:"Il ministero dell'Interno ha contato 161.500 manifestanti in tutto il Paese; i sindacati studenteschi 480.000. Greta Thunberg ha fatto visita ai manifestanti davanti a questa scuola, uno dei primi centri del movimento.",
   ro:"Ministerul de Interne a numărat 161.500 de manifestanți la nivel național; sindicatele de tineret, 480.000. Greta Thunberg i-a vizitat pe manifestanții din fața acestui liceu, unul dintre primele centre ale mișcării."}},
 {d:"2026-10-17",g:"Limoges",place:"Limoges",spot:"Hôtel de Ville, Place Jacques-Chirac",t:"building",src:["f24","ibt"],v:"checked",
  title:{en:"Historic town hall largely destroyed by fire",it:"Lo storico municipio quasi distrutto dal fuoco",ro:"Primăria istorică, distrusă în mare parte de foc"},
  text:{en:"Masked people torched a municipal police car outside, broke windows and set the building alight. The roof collapsed and the regional prefect said the building was largely lost. Inaugurated in 1883, it was listed as a historic monument in 1975. Shops in the centre were also looted. Reports differ on when the fire started.",
   it:"Persone a volto coperto hanno incendiato un'auto della polizia municipale davanti all'edificio, rotto le finestre e appiccato il fuoco all'interno. Il tetto è crollato e il prefetto ha detto che l'edificio è in gran parte perduto. Inaugurato nel 1883, era classificato monumento storico dal 1975. Anche alcuni negozi del centro sono stati saccheggiati. Le fonti divergono sull'ora d'inizio dell'incendio.",
   ro:"Persoane mascate au incendiat o mașină a poliției municipale în fața clădirii, au spart geamurile și au dat foc în interior. Acoperișul s-a prăbușit, iar prefectul a declarat că clădirea este în mare parte pierdută. Inaugurată în 1883, era clasată monument istoric din 1975. Au fost jefuite și magazine din centru. Sursele diferă privind ora la care a izbucnit incendiul."}},
 {d:"2026-10-17",g:"Paris region",ig:"Paris",place:{en:"Paris, 3rd/10th/11th arr.",it:"Parigi, 3°/10°/11° arr.",ro:"Paris, arondismentele 3/10/11"},spot:"Place de la République",t:"looting",src:["aj18","cbs"],v:"checked",
  title:{en:"Shops looted, kiosk burned, Marianne defaced",it:"Negozi saccheggiati, edicola bruciata, Marianne imbrattata",ro:"Magazine jefuite, chioșc incendiat, statuia Marianne vandalizată"},
  text:{en:"Masked groups smashed shop windows and left with stolen goods. A newspaper kiosk burned and the Marianne monument was covered in graffiti, its base partly dismantled.",
   it:"Gruppi a volto coperto hanno sfondato vetrine e sono fuggiti con la merce rubata. Un'edicola è andata a fuoco e il monumento a Marianne è stato coperto di scritte, con la base in parte smontata.",
   ro:"Grupuri mascate au spart vitrine și au plecat cu bunuri furate. Un chioșc de ziare a ars, iar monumentul Marianne a fost acoperit cu graffiti, cu soclul parțial demontat."}},
 {d:"2026-10-17",g:"Paris region",ig:"Paris",place:{en:"Paris, citywide",it:"Parigi, tutta la città",ro:"Paris, în tot orașul"},spot:{en:"Police prefecture figures",it:"Dati della prefettura di polizia",ro:"Cifrele prefecturii de poliție"},t:"looting",src:["iciParis"],v:"checked",
  title:{en:"Dozens of businesses looted; record arrests",it:"Decine di attività saccheggiate; arresti record",ro:"Zeci de afaceri jefuite; număr record de arestări"},
  text:{en:"Pharmacies, bars, IT and clothing shops, supermarkets and luxury stores were hit within hours. The police prefecture reported 855 arrests in Paris, a record. About 1,000 city cleaning staff were deployed on Sunday.",
   it:"In poche ore sono state colpite farmacie, bar, negozi di informatica e di abbigliamento, supermercati e boutique di lusso. La prefettura di polizia ha registrato 855 arresti a Parigi, un record. Domenica sono stati impiegati circa 1.000 addetti alla pulizia della città.",
   ro:"În doar câteva ore au fost vizate farmacii, baruri, magazine de IT și de haine, supermarketuri și magazine de lux. Prefectura de poliție a raportat 855 de arestări la Paris, un record. Duminică au fost mobilizați aproximativ 1.000 de angajați ai serviciului de salubritate al orașului."}},
 {d:"2026-10-17",g:"Paris region",ig:"Paris",place:{en:"Paris, 10th arr.",it:"Parigi, 10° arr.",ro:"Paris, arondismentul 10"},spot:{en:"Near Gare du Nord",it:"Vicino alla Gare du Nord",ro:"Lângă Gare du Nord"},t:"clash",src:["cnn"],v:"checked",
  title:{en:"Stand-off with riot police by the station",it:"Faccia a faccia con la polizia vicino alla stazione",ro:"Confruntare cu forțele de ordine lângă gară"},
  text:{en:"Masked protesters faced riot police in a street near Gare du Nord, one of the city's main rail hubs.",
   it:"Manifestanti a volto coperto hanno fronteggiato la polizia antisommossa in una strada vicino alla Gare du Nord, uno dei principali nodi ferroviari della città.",
   ro:"Protestatari mascați s-au confruntat cu polițiștii antirevoltă pe o stradă de lângă Gare du Nord, unul dintre principalele noduri feroviare ale orașului."}},
 {d:"2026-10-17",g:"Paris region",ig:"Paris",place:{en:"Paris",it:"Parigi",ro:"Paris"},spot:{en:"10th arr. town hall to Place de Clichy",it:"Dal municipio del 10° arr. a Place de Clichy",ro:"De la primăria arondismentului 10 la Place de Clichy"},t:"march",src:["aj18","cnn"],v:"checked",
  title:{en:"The main march itself was peaceful",it:"Il corteo principale è stato pacifico",ro:"Marșul principal a fost pașnic"},
  text:{en:"About 110,000 people marched in Paris. A student who walked the full route described it as peaceful from start to finish; police used tear gas before the march started.",
   it:"A Parigi hanno sfilato circa 110.000 persone. Una studentessa che ha percorso l'intero tragitto lo ha descritto come pacifico dall'inizio alla fine; la polizia ha usato i lacrimogeni già prima della partenza.",
   ro:"Aproximativ 110.000 de oameni au mărșăluit la Paris. O studentă care a parcurs tot traseul l-a descris ca fiind pașnic de la început până la sfârșit; poliția a folosit gaze lacrimogene încă dinainte de pornirea marșului."}},
 {d:"2026-10-17",g:"Marseille",place:{en:"Marseille",it:"Marsiglia",ro:"Marsilia"},spot:{en:"Hôtel de Ville and Vieux-Port",it:"Hôtel de Ville e Vieux-Port",ro:"Hôtel de Ville și Vieux-Port"},t:"building",src:["aj18","fn"],v:"checked",
  title:{en:"City hall doors forced; shops looted",it:"Forzate le porte del municipio; negozi saccheggiati",ro:"Ușile primăriei, forțate; magazine jefuite"},
  text:{en:"A group forced the doors of the city hall and got inside before being pushed out. Dozens of shops around the Vieux-Port were looted, according to the prefecture.",
   it:"Un gruppo ha forzato le porte del municipio ed è entrato prima di essere respinto. Decine di negozi intorno al Vieux-Port sono stati saccheggiati, secondo la prefettura.",
   ro:"Un grup a forțat ușile primăriei și a intrat înainte de a fi scos afară. Zeci de magazine din jurul Vieux-Port au fost jefuite, potrivit prefecturii."}},
 {d:"2026-10-17",g:"Lyon",place:{en:"Lyon",it:"Lione",ro:"Lyon"},spot:"Place Bellecour",t:"arson",src:["echo","lyc"],v:"checked",
  title:{en:"Tourist office pavilion set on fire",it:"Dato alle fiamme il padiglione dell'ufficio del turismo",ro:"Pavilionul oficiului de turism, incendiat"},
  text:{en:"Hooded groups ransacked and set fire to the tourist office pavilion on Place Bellecour while throwing projectiles and firework mortars at police, who used tear gas and a water cannon. Firefighters reached the blaze shortly after 15:00. Neighbouring shops were damaged.",
   it:"Gruppi incappucciati hanno devastato e incendiato il padiglione dell'ufficio del turismo in Place Bellecour, lanciando oggetti e mortaretti contro la polizia, che ha risposto con lacrimogeni e un idrante. I vigili del fuoco hanno raggiunto l'incendio poco dopo le 15:00. Danneggiati anche i negozi vicini.",
   ro:"Grupuri cu glugi au devastat și au incendiat pavilionul oficiului de turism din Place Bellecour, aruncând obiecte și petarde spre poliție, care a răspuns cu gaze lacrimogene și un tun cu apă. Pompierii au ajuns la incendiu puțin după ora 15:00. Au fost avariate și magazinele din apropiere."}},
 {d:"2026-10-17",g:"Bordeaux",place:"Bordeaux",spot:{en:"Prefect's official residence",it:"Residenza ufficiale della prefetta",ro:"Reședința oficială a prefectei"},t:"building",src:["e1"],v:"checked",
  title:{en:"Prefect's residence ransacked",it:"Devastata la residenza della prefetta",ro:"Reședința prefectei, devastată"},
  text:{en:"People broke into the official residence of the Gironde prefect, and the RAID police unit was called in. The prefect also condemned the looting of shops in the centre. Clashes continued near the city hall.",
   it:"Alcune persone sono entrate nella residenza ufficiale della prefetta della Gironda ed è stata chiamata l'unità speciale RAID. La prefetta ha condannato anche i saccheggi dei negozi del centro. Gli scontri sono proseguiti vicino al municipio.",
   ro:"Mai multe persoane au pătruns în reședința oficială a prefectei departamentului Gironde, iar unitatea de intervenție RAID a fost chemată. Prefecta a condamnat și jefuirea magazinelor din centru. Ciocnirile au continuat lângă primărie."}},
 {d:"2026-10-17",g:"Lille",place:"Lille",spot:{en:"Hôtel de Ville and Grand'Place",it:"Hôtel de Ville e Grand'Place",ro:"Hôtel de Ville și Grand'Place"},t:"building",src:["afpLille","iciLille"],v:"checked",
  title:{en:"City hall entered; fires on the Grand'Place",it:"Invaso il municipio; incendi sulla Grand'Place",ro:"Primăria, invadată; incendii pe Grand'Place"},
  text:{en:"Protesters forced several entrances of the city hall and caused damage inside. The Apple Store was broken into and looted. A fire broke out in the building housing the McDonald's on the Grand'Place, and another near the Majestic cinema forced residents to evacuate.",
   it:"I manifestanti hanno forzato diversi ingressi del municipio e causato danni all'interno. L'Apple Store è stato scassinato e saccheggiato. Un incendio è scoppiato nell'edificio del McDonald's sulla Grand'Place e un altro, vicino al cinema Majestic, ha costretto gli abitanti a evacuare.",
   ro:"Protestatarii au forțat mai multe intrări ale primăriei și au provocat pagube în interior. Apple Store a fost spart și jefuit. Un incendiu a izbucnit în clădirea în care se află McDonald's de pe Grand'Place, iar altul, lângă cinematograful Majestic, i-a obligat pe locatari să evacueze."}},
 {d:"2026-10-17",g:"Rennes",place:"Rennes",spot:CC,t:"looting",src:["fn"],v:"checked",
  title:{en:"Dozens of shops looted",it:"Decine di negozi saccheggiati",ro:"Zeci de magazine jefuite"},
